<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<script>/* first-paint marker: stamp the moment parsing starts, so the marker at the end of the
   page can report boot, first render and first painted frame in one line */
var __tBoot=(window.performance&&performance.now)?performance.now():0;</script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1b1f4b">
<title>Reminders</title>
<style>
:root{
  --edge:rgba(255,255,255,.7); --shade:rgba(40,30,90,.18);
  --bg1:#ffb3c7; --bg2:#a9c4ff; --bg3:#b9f0d8; --bg4:#ffe0a3;
  --accent:#0a84ff; --danger:#ff453a;
  --font:ui-rounded,"SF Pro Rounded","SF Pro Display",-apple-system,"Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --edge:rgba(255,255,255,.38); --shade:rgba(0,0,0,.45);
    --bg1:#6a2a6e; --bg2:#1f3b9c; --bg3:#0b6a6a; --bg4:#8a4a1c;
  }
}
:root[data-theme="dark"]{
  --edge:rgba(255,255,255,.38); --shade:rgba(0,0,0,.45);
  --bg1:#6a2a6e; --bg2:#1f3b9c; --bg3:#0b6a6a; --bg4:#8a4a1c;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{font-family:var(--font);color:var(--ink);background:var(--bg2);overflow:hidden;}
button,input{font:inherit;color:inherit}
button{border:0;background:none;cursor:pointer}

/* living background the glass refracts */
.bg{position:fixed;inset:0;z-index:0;overflow:hidden;background:linear-gradient(160deg,var(--bg1),var(--bg2) 55%,var(--bg3))}
.blob{position:absolute;border-radius:50%;filter:blur(40px);opacity:.9;animation:float 22s ease-in-out infinite alternate}
.b1{width:60vmax;height:60vmax;left:-20vmax;top:-12vmax;background:var(--bg4)}
.b2{width:50vmax;height:50vmax;right:-18vmax;top:30%;background:var(--bg1);animation-delay:-8s}
.b3{width:55vmax;height:55vmax;left:5vmax;bottom:-25vmax;background:var(--bg3);animation-delay:-14s}
@keyframes float{to{transform:translate(8vmax,-6vmax) scale(1.15)}}
@media (prefers-reduced-motion:reduce){.blob{animation:none}}

/* the glass material */
.glass{
  background:linear-gradient(135deg,var(--g1),var(--g2));
  -webkit-backdrop-filter:blur(26px) saturate(190%) brightness(1.05);
  border:1px solid var(--edge);
}

.app{position:relative;z-index:1;height:100%;display:flex;flex-direction:column;max-width:560px;margin:0 auto}
header{padding:22px 24px 6px}
header h1{margin:0;}
header p{margin:2px 0 0;color:var(--ink2);}

.pages{flex:1;display:flex;overflow-y:hidden;scroll-snap-type:x mandatory;
  scrollbar-width:none;overscroll-behavior-x:contain}
.pages::-webkit-scrollbar{display:none}
.page{flex:0 0 100%;scroll-snap-align:start;scroll-snap-stop:always;overflow-y:auto;
  content-visibility:auto;
  padding:12px 16px 190px;display:flex;flex-direction:column;gap:10px;align-content:flex-start;scrollbar-width:none}
.page::-webkit-scrollbar{display:none}

.item{display:flex;align-items:center;gap:12px;padding:13px 14px;border-radius:24px;animation:pop .35s cubic-bezier(.2,.9,.3,1.2)}
@keyframes pop{from{opacity:0;transform:scale(.94) translateY(6px)}}
.check{flex:none;width:28px;height:28px;border-radius:50%;border:2px solid var(--c);
  display:grid;place-items:center;transition:background .25s,transform .2s}
.check:active{transform:scale(.88)}
.item.done .check{background:var(--c)}
.item.done .check::after{content:"";width:7px;height:12px;border:solid #fff;border-width:0 2.5px 2.5px 0;transform:translateY(-1px) rotate(45deg)}
.txt{flex:1;min-width:0}
.txt b{display:block;font-size:17px;overflow-wrap:anywhere}
.item.done .txt b{text-decoration:line-through;opacity:.5}
.txt small{display:block;margin-top:2px;color:var(--ink2);overflow-wrap:anywhere}
.txt small.late{}
.del{flex:none;width:34px;height:34px;border-radius:50%;line-height:1}
.del:hover{background:rgba(255,255,255,.3)}
.empty{margin:auto;padding:60px 20px;text-align:center;line-height:1.45}
.empty span{display:block;font-size:44px;margin-bottom:8px}

/* floating glass tab bar with sliding lens */
.dock{position:fixed;left:0;right:0;z-index:5;display:flex;
  flex-direction:column;align-items:center;gap:12px;pointer-events:none}
.fab{pointer-events:auto;align-self:flex-end;margin-right:max(20px,calc(50% - 260px));width:58px;height:58px;border-radius:50%;
  font-size:32px;font-weight:300;display:grid;place-items:center;}
.fab:active{transform:scale(.9)}
.tabs{pointer-events:auto;position:relative;width:min(92vw,520px);display:flex;padding:6px;border-radius:999px;
  touch-action:pan-y;user-select:none;-webkit-user-select:none;cursor:grab;}
.lens{position:absolute;top:6px;bottom:6px;width:calc((100% - 12px)/4);border-radius:999px;
  -webkit-backdrop-filter:blur(6px) saturate(220%) brightness(1.18);backdrop-filter:blur(6px) saturate(220%) brightness(1.18);
  border:1px solid rgba(255,255,255,.85);}
.tabs.drag .lens{--s:1.14}
.tabs.drag{cursor:grabbing}
.tab{position:relative;z-index:1;flex:1;padding:9px 0 7px;border-radius:999px;
  color:var(--ink2);display:flex;flex-direction:column;align-items:center;gap:2px;transition:color .2s}
.tab svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.tab.on{}
.tab i{position:absolute;top:4px;right:calc(50% - 22px);min-width:17px;height:17px;border-radius:9px;background:var(--danger);
  color:#fff;font:700 10.5px/17px var(--font);text-align:center;font-style:normal;padding:0 4px}
.tab i:empty{display:none}

/* add sheet */
.scrim{position:fixed;inset:0;z-index:8;background:rgba(10,10,30,.28);opacity:0;pointer-events:none;transition:opacity .3s}
.scrim.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:50%;bottom:0;z-index:9;width:min(100%,560px);transform:translate(-50%,105%);
  transition:transform .45s cubic-bezier(.2,.9,.25,1);border-radius:34px 34px 0 0;padding:20px 20px calc(24px + env(safe-area-inset-bottom,0px))}
.sheet.open{transform:translate(-50%,0)}
.sheet h2{margin:0 0 14px;font-size:22px;font-weight:800;text-align:center}
.field{width:100%;padding:14px 16px;margin-bottom:10px;border-radius:18px;border:1px solid var(--edge);
  background:rgba(255,255,255,.28);outline:none;font-size:16.5px;font-weight:600}
.field::placeholder{color:var(--ink2)}
.field:focus{box-shadow:0 0 0 3px rgba(10,132,255,.45)}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:4px 2px 16px}
.dots{display:flex;gap:10px}
.dot{width:30px;height:30px;border-radius:50%;background:var(--c);border:3px solid transparent;
  box-shadow:inset 0 1px 2px rgba(255,255,255,.7)}
.dot.sel{border-color:#fff;transform:scale(1.12)}
.btns{display:flex;gap:10px}
.btn{flex:1;padding:15px;border-radius:999px;font-weight:800;font-size:16.5px}
.btn.pri{background:var(--accent);color:#fff;box-shadow:inset 0 1.5px 0 rgba(255,255,255,.5),0 6px 18px rgba(10,132,255,.4)}
.btn.sec{border:1px solid var(--edge);background:rgba(255,255,255,.25)}
.btn:disabled{opacity:.45}

/* in-app alert banner */
.toast{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));left:50%;z-index:20;width:min(92vw,420px);
  transform:translate(-50%,-160%);transition:transform .5s cubic-bezier(.2,.9,.25,1.1);padding:14px 18px;border-radius:26px}
.toast.show{transform:translate(-50%,0)}
.toast b{display:block;font-size:15px}.toast span{font-size:14px;color:var(--ink2);font-weight:600}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

/* ---- more liquid glass ---- */
.item.glass,.fab.glass{position:relative}
.glass::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1.5px;pointer-events:none;
  background:conic-gradient(from 210deg,rgba(255,255,255,.95),rgba(255,255,255,.04) 25%,rgba(255,255,255,.55) 50%,rgba(255,255,255,.04) 75%,rgba(255,255,255,.95));
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude}
.glass::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:radial-gradient(170px circle at var(--mx,22%) var(--my,0%),rgba(255,255,255,.55),transparent 62%);
  opacity:var(--lit,.5);transition:opacity .35s}
/* keep the specular highlight on its own compositor layer while it moves: moving it repaints
   that layer alone instead of dirtying the card, so the card's backdrop-filter is not re-run
   on every pointermove. The class goes on with the first move and comes off once the fade-out
   has finished, so a card that is not animating pins no layer. */
.glass.lit::after{will-change:opacity}
.orb{position:absolute;border-radius:50%;animation:drift 18s ease-in-out infinite alternate;
  background:radial-gradient(circle at 30% 25%,rgba(255,255,255,.95),rgba(255,255,255,.18) 38%,rgba(255,255,255,.04) 72%);
  box-shadow:inset -8px -10px 24px rgba(255,255,255,.28),0 22px 40px rgba(30,20,90,.16)}
.o1{width:92px;height:92px;left:10%;top:24%}
.o2{width:56px;height:56px;right:12%;top:46%;animation-delay:-6s}
.o3{width:124px;height:124px;left:56%;bottom:20%;animation-delay:-11s}
@keyframes drift{to{transform:translate(34px,-56px) rotate(25deg)}}
@media (prefers-reduced-motion:reduce){.orb{animation:none}}
/* background motion parks while the app is backgrounded */
html.paused .blob,html.paused .orb{animation-play-state:paused}
.item{transition:transform .35s cubic-bezier(.2,1.5,.4,1)}
.item:active{transform:scale(.97)}
.field{box-shadow:inset 0 2px 7px rgba(0,0,0,.12),inset 0 1px 0 rgba(255,255,255,.65)}
.tab.on svg{filter:drop-shadow(0 0 6px rgba(10,132,255,.65))}
.tabs{box-shadow:inset 0 1.5px 0 rgba(255,255,255,.8),inset 0 -2px 6px rgba(255,255,255,.18),0 18px 40px var(--shade)}
.lens{
  box-shadow:inset 0 2px 3px rgba(255,255,255,.95),inset 3px 0 7px rgba(255,110,200,.38),inset -3px 0 7px rgba(80,210,255,.4),
             inset 0 -4px 10px rgba(255,255,255,.3),0 6px 18px rgba(30,20,90,.28);
  transform:translateX(calc(var(--p)*100%)) scale(calc(var(--s,1)*var(--sx,1)),calc(var(--s,1)*(2 - var(--sx,1))))}
.lens::after{content:"";position:absolute;left:14%;right:14%;top:4px;height:38%;border-radius:999px;
  background:linear-gradient(180deg,rgba(255,255,255,.85),rgba(255,255,255,0))}
.lens.settle{transition:transform .55s cubic-bezier(.3,1.7,.4,1)}
.tabs.drag .lens{background:linear-gradient(180deg,rgba(255,255,255,.36),rgba(255,255,255,.06))}
.refract .lens{-webkit-backdrop-filter:url(#lg) blur(1px) saturate(230%) brightness(1.2);backdrop-filter:url(#lg) blur(1px) saturate(230%) brightness(1.2)}
.refract .tabs.drag .lens{-webkit-backdrop-filter:url(#lg) saturate(250%) brightness(1.25);backdrop-filter:url(#lg) saturate(250%) brightness(1.25)}

/* ---- extra transparent ---- */
.glass{-webkit-backdrop-filter:blur(12px) saturate(170%) brightness(1.04);backdrop-filter:blur(12px) saturate(170%) brightness(1.04);
  border-color:rgba(255,255,255,.5)}
.sheet.glass{-webkit-backdrop-filter:blur(22px) saturate(180%);backdrop-filter:blur(22px) saturate(180%)}
.field{background:rgba(255,255,255,.1)}
.btn.sec{background:rgba(255,255,255,.08)}
.btn.pri{background:rgba(10,132,255,.78)}
.lens{background:linear-gradient(180deg,rgba(255,255,255,.34),rgba(255,255,255,.05))}
.tabs.drag .lens{background:linear-gradient(180deg,rgba(255,255,255,.2),rgba(255,255,255,.01))}
.orb{opacity:.95}
.txt b{text-shadow:0 1px 10px rgba(255,255,255,.35)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .txt b{text-shadow:0 1px 8px rgba(0,0,0,.35)}}

/* ---- fully clear glass ---- */
:root{--g1:rgba(255,255,255,.07);--g2:rgba(255,255,255,0)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--g1:rgba(255,255,255,.05);--g2:rgba(255,255,255,0)}}
:root[data-theme="dark"]{--g1:rgba(255,255,255,.05);--g2:rgba(255,255,255,0)}
.glass{-webkit-backdrop-filter:blur(.6px) saturate(140%) brightness(1.06);backdrop-filter:blur(.6px) saturate(140%) brightness(1.06);
  border-color:rgba(255,255,255,.7);
  box-shadow:inset 0 1.5px 0 rgba(255,255,255,.9),inset 0 -1px 0 rgba(255,255,255,.35),
             inset 0 0 22px rgba(255,255,255,.22),inset 0 0 2px rgba(255,255,255,.7),0 10px 28px rgba(30,20,90,.12)}
.sheet.glass{-webkit-backdrop-filter:blur(4px) saturate(150%);backdrop-filter:blur(4px) saturate(150%)}
.refract .glass{-webkit-backdrop-filter:url(#lg) blur(.5px) saturate(140%) brightness(1.05);backdrop-filter:url(#lg) blur(.5px) saturate(140%) brightness(1.05)}
.refract .sheet.glass{-webkit-backdrop-filter:blur(4px) saturate(150%);backdrop-filter:blur(4px) saturate(150%)}
.field{background:rgba(255,255,255,.04);border-color:rgba(255,255,255,.55)}
.btn.sec{background:rgba(255,255,255,.03)}
.lens{background:linear-gradient(180deg,rgba(255,255,255,.18),rgba(255,255,255,0))}
.tabs.drag .lens{background:rgba(255,255,255,.02)}
.txt b,.txt small,header h1,header p,.sheet h2,.tab{text-shadow:0 0 10px rgba(255,255,255,.55),0 1px 2px rgba(255,255,255,.4)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .txt b,:root:not([data-theme="light"]) .txt small,:root:not([data-theme="light"]) header h1,:root:not([data-theme="light"]) header p,:root:not([data-theme="light"]) .sheet h2,:root:not([data-theme="light"]) .tab{text-shadow:0 0 10px rgba(0,0,0,.5),0 1px 2px rgba(0,0,0,.4)}}

/* ---- fully readable text ---- */
:root{--ink:#070914;--ink2:rgba(7,9,20,.86);--late:#d70015;
  --halo:0 0 2px rgba(255,255,255,.95),0 0 6px rgba(255,255,255,.9),0 0 14px rgba(255,255,255,.7),0 0 26px rgba(255,255,255,.4)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ink:#ffffff;--ink2:rgba(255,255,255,.9);--late:#ff7a72;
  --halo:0 0 2px rgba(0,0,0,.95),0 0 6px rgba(0,0,0,.85),0 0 14px rgba(0,0,0,.6),0 0 26px rgba(0,0,0,.35)}}
:root[data-theme="dark"]{--ink:#ffffff;--ink2:rgba(255,255,255,.9);--late:#ff7a72;
  --halo:0 0 2px rgba(0,0,0,.95),0 0 6px rgba(0,0,0,.85),0 0 14px rgba(0,0,0,.6),0 0 26px rgba(0,0,0,.35)}
body{-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
header h1{font-size:38px;font-weight:900;letter-spacing:-.5px}
header p{font-size:16px;font-weight:700}
.txt b{font-size:18.5px;font-weight:800;line-height:1.25}
.txt small{font-size:15px;font-weight:700;line-height:1.3}
.txt small.late{color:var(--late)}
.tab{font-size:12.5px;font-weight:800;letter-spacing:.1px}
.tab.on{color:#0060d6}
.sheet h2{font-size:24px;font-weight:900}
.field{font-size:17.5px;font-weight:700;color:var(--ink)}
.field::placeholder{color:var(--ink2);opacity:1}
.btn{font-weight:900}
.btn.sec{color:var(--ink)}
.empty{font-size:17px;font-weight:800;color:var(--ink)}
.del{color:var(--ink);font-size:24px;font-weight:700}
.txt b,.txt small,header h1,header p,.sheet h2,.tab,.empty,.del,.row span{text-shadow:var(--halo)}
.toast b,.toast span{text-shadow:var(--halo)}
.toast span{color:var(--ink)}
.field,.btn{text-shadow:var(--halo)}
.btn.pri{text-shadow:0 1px 3px rgba(0,0,0,.45)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .tab.on{color:#5ab0ff}
:root:not([data-theme="light"]) .txt b,:root:not([data-theme="light"]) .txt small,:root:not([data-theme="light"]) header h1,:root:not([data-theme="light"]) header p,:root:not([data-theme="light"]) .sheet h2,:root:not([data-theme="light"]) .tab{text-shadow:var(--halo)}}

/* ---- android shell ---- */
html,body{overscroll-behavior:none}
body{padding-top:var(--sat,env(safe-area-inset-top,0px))!important;padding-bottom:0!important}
.dock{bottom:calc(14px + var(--sab,env(safe-area-inset-bottom,0px)))}
.sheet{padding-bottom:calc(24px + var(--sab,env(safe-area-inset-bottom,0px)))}
.page{padding-bottom:calc(190px + var(--sab,0px))}

/* ============================================================
   depth bounce + 4D press
   Cards live in a 3D space: pressing lifts them toward the
   viewer, tilts them toward the finger, then releases through
   an overshoot spring that settles back to rest.
   ============================================================ */
.page{perspective:1000px;perspective-origin:50% 35%}

.item{
  transform-style:preserve-3d;
  transform:translateZ(0) rotateX(0deg) rotateY(0deg) scale(1);
  transition:transform .55s cubic-bezier(.16,1.45,.32,1),
             box-shadow .55s cubic-bezier(.16,1.45,.32,1),
             filter .3s ease;
}
.item.press{
  transition-duration:.13s;
  transition-timing-function:cubic-bezier(.25,.9,.3,1);
  transform:translateZ(calc(38px * var(--d))) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg)) scale(1.035);
  box-shadow:0 30px 52px rgba(30,20,90,.32),
             inset 0 1.5px 0 rgba(255,255,255,.95),
             inset 0 0 26px rgba(255,255,255,.28);
  filter:brightness(1.06);
  z-index:3;
}
@keyframes depthBounce{
  0%  {transform:translateZ(calc(38px * var(--d))) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg)) scale(1.035)}
  34% {transform:translateZ(calc(-10px * var(--d))) rotateX(calc(var(--rx,0deg) * -.45)) rotateY(calc(var(--ry,0deg) * -.45)) scale(.978)}
  58% {transform:translateZ(calc(17px * var(--d))) rotateX(calc(var(--rx,0deg) * .3)) rotateY(calc(var(--ry,0deg) * .3)) scale(1.014)}
  78% {transform:translateZ(calc(-4px * var(--d))) rotateX(calc(var(--rx,0deg) * -.12)) rotateY(calc(var(--ry,0deg) * -.12)) scale(.996)}
  100%{transform:translateZ(0) rotateX(0deg) rotateY(0deg) scale(1)}
}
.item.bounce{animation:depthBounce .68s cubic-bezier(.3,.85,.3,1) both}

/* cards fly in from depth, one after another */
@keyframes cascadeIn{
  0%  {opacity:0;transform:translateZ(calc(-130px * var(--d))) translateY(16px) rotateX(7deg) scale(.93)}
  55% {opacity:1;transform:translateZ(calc(22px * var(--d))) translateY(-3px) rotateX(-1.4deg) scale(1.012)}
  78% {transform:translateZ(calc(-6px * var(--d))) translateY(1px) rotateX(.5deg) scale(.998)}
  100%{opacity:1;transform:translateZ(0) translateY(0) rotateX(0) scale(1)}
}
.item.cascade{animation:cascadeIn .62s cubic-bezier(.22,1.1,.32,1) both}

/* the tick lands with its own little pop */
@keyframes tickPop{
  0%{transform:scale(.35)}
  55%{transform:scale(1.3)}
  78%{transform:scale(.93)}
  100%{transform:scale(1)}
}
.item.done .check{animation:tickPop .5s cubic-bezier(.3,.9,.3,1)}

/* floating button: push away, spring back past rest */
.dock{perspective:800px}
.fab{transform:translateZ(0) scale(1);
  transition:transform .5s cubic-bezier(.16,1.5,.3,1),box-shadow .5s cubic-bezier(.16,1.5,.3,1)}
.fab.press{transform:translateZ(calc(-26px * var(--d))) scale(.9);transition-duration:.12s}
@keyframes fabBounce{
  0%  {transform:translateZ(calc(-26px * var(--d))) scale(.9)}
  40% {transform:translateZ(calc(34px * var(--d))) scale(1.13)}
  64% {transform:translateZ(calc(-7px * var(--d))) scale(.97)}
  84% {transform:translateZ(calc(9px * var(--d))) scale(1.02)}
  100%{transform:translateZ(0) scale(1)}
}
.fab.bounce{animation:fabBounce .62s cubic-bezier(.3,.9,.3,1) both}

/* the lens dips into the bar and springs back up */
.tabs{perspective:900px}
@keyframes lensBounce{
  0%  {transform:translateX(calc(var(--p) * 100%)) scale3d(1,1,1) translateZ(0)}
  42% {transform:translateX(calc(var(--p) * 100%)) scale3d(1.07,1.24,1) translateZ(calc(28px * var(--d)))}
  70% {transform:translateX(calc(var(--p) * 100%)) scale3d(.97,.92,1) translateZ(calc(-7px * var(--d)))}
  100%{transform:translateX(calc(var(--p) * 100%)) scale3d(1,1,1) translateZ(0)}
}
.lens.bounce{animation:lensBounce .58s cubic-bezier(.3,.9,.3,1) both}

/* sheet and toast arrive from depth */
.sheet{
  transform-origin:50% 100%;
  transform:perspective(1000px) translate(-50%,105%) rotateX(14deg) scale(.96);
  transition:transform .6s cubic-bezier(.18,1.25,.32,1);
}
.sheet.open{transform:perspective(1000px) translate(-50%,0) rotateX(0deg) scale(1)}
.toast{transform:perspective(800px) translate(-50%,-160%) rotateX(-25deg) scale(.92);
  transition:transform .55s cubic-bezier(.18,1.4,.32,1)}
.toast.show{transform:perspective(800px) translate(-50%,0) rotateX(0deg) scale(1)}

@media (prefers-reduced-motion:reduce){
  .item.press{transform:none;box-shadow:none;filter:none}
  .item.bounce,.item.cascade,.fab.press,.fab.bounce,.lens.bounce,.item.done .check{animation:none!important}
  .fab{transition:none}
  .sheet,.toast{transition:transform .18s linear}
}

/* ============================================================
   parallax + adjustable depth
   --px / --py are driven by the pointer or the device tilt,
   --d scales depth, --par scales parallax, --tilt gates the 3D.
   ============================================================ */
:root{--d:1;--par:.7;--tilt:1;--px:0;--py:0}

.app{perspective:1200px}
.pages{
  transform-origin:50% 42%;
  transform:rotateX(calc(var(--py) * -1.4deg * var(--tilt) * var(--par)))
            rotateY(calc(var(--px) * 1.8deg * var(--tilt) * var(--par)));
}
.bg{
  translate:calc(var(--px) * -20px * var(--par)) calc(var(--py) * -16px * var(--par));
  scale:1.08;
}
header{translate:calc(var(--px) * 4px * var(--par)) calc(var(--py) * 3px * var(--par))}
.item{
  translate:calc(var(--px) * 6px * var(--par) * var(--ly,1))
            calc(var(--py) * 4px * var(--par) * var(--ly,1));
}
.page .item:nth-child(1){--ly:1}
.page .item:nth-child(2){--ly:1.15}
.page .item:nth-child(3){--ly:1.3}
.page .item:nth-child(4){--ly:1.45}
.page .item:nth-child(5){--ly:1.6}
.page .item:nth-child(n+6){--ly:1.75}

/* gear button */
header{position:relative}
.gear{position:absolute;top:12px;right:18px;width:44px;height:44px;border-radius:50%;
  display:grid;place-items:center;color:var(--ink);padding:0}
.gear svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;
  stroke-linecap:round;stroke-linejoin:round}
.gear:active{transform:scale(.92)}

/* settings controls */
.set-row{display:flex;align-items:center;justify-content:space-between;gap:12px;
  margin:14px 2px 0;font-weight:800;font-size:16px}
.set-row output{color:var(--ink2);font-weight:800;font-variant-numeric:tabular-nums}
.range{-webkit-appearance:none;appearance:none;width:100%;height:6px;margin:10px 0 4px;
  border-radius:99px;background:rgba(255,255,255,.34);outline:none;border:0}
.range::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;border-radius:50%;
  background:#fff;border:2px solid rgba(255,255,255,.95);cursor:pointer;
  box-shadow:0 2px 9px rgba(30,20,90,.38),inset 0 -1px 2px rgba(0,0,0,.12)}
.range::-moz-range-thumb{width:24px;height:24px;border-radius:50%;background:#fff;border:0;
  box-shadow:0 2px 9px rgba(30,20,90,.38)}
.switch{width:56px;height:32px;border-radius:999px;background:rgba(120,120,140,.38);
  border:1px solid var(--edge);position:relative;padding:0;flex:none;transition:background .25s}
.switch i{position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;
  box-shadow:0 2px 6px rgba(0,0,0,.25);transition:transform .32s cubic-bezier(.2,1.4,.3,1)}
.switch.on{background:var(--accent)}
.switch.on i{transform:translateX(24px)}
.hint{margin:14px 2px 0;font-size:13.5px;font-weight:600;color:var(--ink2);line-height:1.4}

@media (prefers-reduced-motion:reduce){
  .bg,header,.item{translate:none}
  .pages{transform:none}
}

    <button class="tab on" data-i="0"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.5"/><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M5.3 18.7l1.6-1.6M17.1 6.9l1.6-1.6"/></svg>Today<i id="n0"></i></button>

  and cards shift as you move or tilt the phone.</p>

<div class="toast glass" id="toast" role="status"><b id="t-title"></b><span id="t-sub"></span></div>

<script>
(function(){
  var KEY="liquid.reminders.v1", COLORS=["#0a84ff","#ff375f","#30d158","#ff9f0a","#bf5af2"];
  var BR=(window.AndroidBridge||null);
  /* a value the app cannot read is put aside under KEY+".corrupt" instead of being
     silently destroyed, so it can still be recovered by hand */
  function stash(raw){
    try{ localStorage.setItem(KEY+".corrupt",raw); }catch(e){}
    try{ console.info("[store] unreadable list kept under "+KEY+".corrupt"); }catch(e){}
  }
  /* a due is stored as milliseconds since the epoch, 0 meaning "no date". A numeric string
     is read as that number; anything else that is not a finite positive number is 0. */
  function dueNum(v){
    var n=NaN;
    if(typeof v==="number") n=v;
    else if(typeof v==="string"&&v.trim()!=="") n=Number(v);
    return (isFinite(n)&&n>0)?n:0;
  }
  /* ids have to be unique: two reminders saved inside the same millisecond used to get the
     same Date.now(), so a toggle moved the wrong card and a delete took out both. A new id
     is now strictly greater than every id already seen, seeded from the list on load, so it
     can never repeat one that is already there. */
  var lastId=0;
  function newId(){
    var t=Date.now();
    lastId=t>lastId?t:lastId+1;
    return lastId;
  }
  function seedIds(list){
    lastId=0;
    list.forEach(function(it){ if(typeof it.id==="number"&&isFinite(it.id)&&it.id>lastId) lastId=it.id });
  }
  /* the colour ends up inside a style attribute, so it is never taken from storage as it
     stands: only a value that spells a palette colour (in any case) is kept, rewritten in
     the palette's own spelling, and anything else — a colour that is not in the palette, a
     blank, a number, an array, a value carrying extra declarations — becomes the first
     colour. Nothing from the store is ever copied into the attribute. */
  function colorOf(v){
    var s=(typeof v==="string")?v.trim().toLowerCase():"";
    for(var k=0;k<COLORS.length;k++) if(COLORS[k]===s) return COLORS[k];
    return COLORS[0];
  }
  /* a title that is only whitespace is not a title: a card built from one reads as blank and
     cannot be told apart from any other. The invisible marks a paste can carry (zero-width
     space, joiners, word joiner, byte-order mark) are dropped, and what is left is trimmed,
     so the check on the save button and the value that is stored are the same thing. */
  function titleOf(v){
    var s=(typeof v==="string")?v:"";
    return s.replace(/[\u200b-\u200d\u2060\ufeff]/g,"").trim();
  }
  /* read the stored list. Anything that is not a JSON array of objects is set aside and
     the store is rewritten clean, so one bad value cannot leave the app empty on every
     load; entries that are not reminders are dropped and the good ones are kept. */
  function load(){
    var raw=null;
    try{ raw=localStorage.getItem(KEY); }catch(e){ return []; }
    if(!raw) return [];
    var v=null;
    try{ v=JSON.parse(raw); }catch(e){ v=null; }
    if(!(v instanceof Array)){
      stash(raw);
      try{ localStorage.setItem(KEY,"[]"); }catch(e){}
      return [];
    }
    var kept=v.filter(function(it){return it&&typeof it==="object"&&!(it instanceof Array)});
    if(kept.length!==v.length){
      stash(raw);
      try{ localStorage.setItem(KEY,JSON.stringify(kept)); }catch(e){}
    }
    /* one bad due (NaN, a negative, a string that is not a number) would sort as a hole and
       print an invalid date, so every due is normalised here and the clean list is written
       back; the reminder itself is kept, it just loses a date it never really had */
    var fixed=false;
    kept.forEach(function(it){
      var d=dueNum(it.due);
      if(d!==it.due){ it.due=d; fixed=true; }
    });
    if(fixed){ try{ localStorage.setItem(KEY,JSON.stringify(kept)); }catch(e){} }
    /* and for the colour: a card is built with it in its style attribute, so a stored value
       that is not one of the palette colours is replaced here and the cleaned list written
       back, like the other load-time repairs */
    var cols=false;
    kept.forEach(function(it){
      var c=colorOf(it.color);
      if(c!==it.color){ it.color=c; cols=true; }
    });
    if(cols){ try{ localStorage.setItem(KEY,JSON.stringify(kept)); }catch(e){} }
    /* the same goes for ids: a list saved by an older build can carry repeats (or a missing
       one), so the first holder keeps its id, every later repeat gets a free one, and the
       cleaned list is written back like the other load-time repairs. */
    seedIds(kept);
    var seen={}, ids=false;
    kept.forEach(function(it){
      if(typeof it.id!=="number"||!isFinite(it.id)||it.id<=0||seen[it.id]){ it.id=newId(); ids=true; }
      seen[it.id]=1;
    });
    if(ids){ try{ localStorage.setItem(KEY,JSON.stringify(kept)); }catch(e){} }
    return kept;
  }
  var items=load(), color=COLORS[0];
  /* a write that does not fit is reported, not swallowed: the list in memory stays as the
     user left it, but they are told the change will not survive a reload */
  function persist(){
    try{ localStorage.setItem(KEY,JSON.stringify(items)); }
    catch(e){ saveFailed(e); }
    schedule();
  }
  /* hand the whole list to the Android alarm scheduler */
  function syncAll(){
    if(!BR)return;
    try{ BR.resync(JSON.stringify(items.map(function(i){
      return {id:i.id,title:i.title,notes:i.notes||"",due:i.due||0,done:!!i.done};
    }))); }catch(e){}
  }
  var $=function(s){return document.querySelector(s)};
  var pages=$("#pages"), tabs=$("#tabs"), TITLES=["Today","Upcoming","All","Done"];
  function pad(n){return n<10?"0"+n:n}
  function localInput(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())+"T"+pad(d.getHours())+":"+pad(d.getMinutes())}
  function endOfToday(){var d=new Date();d.setHours(23,59,59,999);return d.getTime()}
  function fmt(t){
    var d=new Date(t), n=new Date(), tm=d.toLocaleTimeString([],{hour:"numeric",minute:"2-digit"});
    var diff=Math.round((new Date(d.getFullYear(),d.getMonth(),d.getDate())-new Date(n.getFullYear(),n.getMonth(),n.getDate()))/864e5);
    if(diff===0) return "Today, "+tm; if(diff===1) return "Tomorrow, "+tm; if(diff===-1) return "Yesterday, "+tm;
    return d.toLocaleDateString([],{weekday:"short",month:"short",day:"numeric"})+", "+tm;
  }
  function sortFn(a,b){return (a.due||9e15)-(b.due||9e15)}
  var EMPTY=[
    ["🌤️","Nothing due today.<br>Tap + to add a reminder."],
    ["🗓️","No upcoming reminders.<br>Tap + to plan ahead."],
    ["📝","No reminders yet.<br>Tap + to create your first one."],
    ["✨","Finished reminders show up here."]
  ];
  /* build one card as DOM nodes, so nothing is parsed back out of a string */
  function card(it){
    var late=!it.done&&it.due&&it.due<Date.now();
    var el=document.createElement("article");
    el.className="item glass"+(it.done?" done":"");
    el.setAttribute("style","--c:"+colorOf(it.color));
    el.dataset.id=it.id;
    var chk=document.createElement("button");
    chk.className="check";chk.dataset.a="toggle";chk.setAttribute("aria-label","Mark done");
    var txt=document.createElement("div");txt.className="txt";
    var b=document.createElement("b");b.textContent=it.title;txt.appendChild(b);
    if(it.due){var t=document.createElement("small");t.className=late?"late":"";t.textContent=fmt(it.due);txt.appendChild(t)}
    if(it.notes){var n=document.createElement("small");n.textContent=it.notes;txt.appendChild(n)}
    var del=document.createElement("button");
    del.className="del";del.dataset.a="del";del.setAttribute("aria-label","Delete reminder");del.textContent="×";
    el.appendChild(chk);el.appendChild(txt);el.appendChild(del);
    return el;
  }
  /* one empty state per page, built the same way wherever it is needed */
  function emptyEl(i){
    var e=document.createElement("div"); e.className="empty";
    e.innerHTML="<span>"+EMPTY[i][0]+"</span>"+EMPTY[i][1];
    return e;
  }
  /* what each page shows right now, and how many reminders are still open */
  function board(){
    var eod=endOfToday(), open=items.filter(function(i){return !i.done}), done=items.filter(function(i){return i.done});
    var pages=[
      open.filter(function(i){return !i.due||i.due<=eod}).sort(sortFn),
      open.filter(function(i){return i.due&&i.due>eod}).sort(sortFn),
      open.sort(sortFn).concat(done),
      done.sort(function(a,b){return (b.doneAt||0)-(a.doneAt||0)})
    ];
    return {pages:pages, open:open.length};
  }
  function counts(b){
    var n=b.pages[0].length; $("#n0").textContent=n?n:"";
    $("#sub").textContent=new Date().toLocaleDateString([],{weekday:"long",month:"long",day:"numeric"})+(b.open?" · "+b.open+" to do":"");
  }
  function render(){
    var b=board(), lists=b.pages;
    lists.forEach(function(l,i){
      var page=$("#p"+i), frag=document.createDocumentFragment();
      if(l.length){ l.forEach(function(it){ frag.appendChild(card(it)) }) }
      else frag.appendChild(emptyEl(i));
      page.textContent=""; page.appendChild(frag);
    });
    counts(b);
  }
  /* a toggle only changes one reminder, so move that one card into place on each page
     and leave every other card alone instead of rebuilding all four lists */
  function itemKids(page){
    return [].filter.call(page.children,function(n){return n.classList&&n.classList.contains("item")});
  }
  function placeOnPage(page,i,order,it){
    var kids=itemKids(page), node=null, empty=null, pos=-1, k;
    for(k=0;k<order.length;k++) if(order[k].id===it.id){pos=k;break}
    for(k=0;k<kids.length;k++) if(+kids[k].dataset.id===it.id){node=kids[k];break}
    for(k=0;k<page.children.length;k++) if(page.children[k].classList.contains("empty")){empty=page.children[k];break}
    if(pos<0){
      if(!node) return;                       /* this page never showed it: nothing to do */
      page.removeChild(node);
      if(!itemKids(page).length) page.appendChild(emptyEl(i));
      return;
    }
    if(!node) node=card(it);                  /* first time on this page */
    else {
      node.classList.toggle("done",!!it.done);
      if(it.due){                             /* the due line is late only while it is open */
        var t=node.querySelector(".txt small");
        if(t) t.className=(!it.done&&it.due<Date.now())?"late":"";
      }
    }
    if(empty) page.removeChild(empty);
    var next=null;
    for(k=0;k<kids.length;k++){
      var n=kids[k], p=-1;
      if(n===node) continue;
      for(var j=0;j<order.length;j++) if(order[j].id===+n.dataset.id){p=j;break}
      if(p>pos){next=n;break}
    }
    if(next) page.insertBefore(node,next); else page.appendChild(node);
  }
  function moveCard(it){
    var b=board();
    for(var i=0;i<4;i++) placeOnPage($("#p"+i),i,b.pages[i],it);
    counts(b);
  }

  /* ---- swipe-through navigation: pager scroll drives the glass lens ---- */
  var lens=$(".lens"),prevP=0,st,tabEls=[].slice.call(document.querySelectorAll(".tab")), dragging=false, lastIdx=0, pageW=0;
  /* the page width only changes on layout, never mid-scroll: measure once, reuse */
  function measure(){pageW=pages.clientWidth||0}
  if(window.ResizeObserver)new ResizeObserver(measure).observe(pages);
  function sync(){
    var w=pageW||(measure(),pageW)||1, p=Math.max(0,Math.min(3,pages.scrollLeft/w));
    tabs.style.setProperty("--p",p);
    var dp=Math.abs(p-prevP);prevP=p;
    lens.classList.remove("settle");
    tabs.style.setProperty("--sx",1+Math.min(.18,dp*9));
    clearTimeout(st);st=setTimeout(function(){tabs.style.setProperty("--sx",1);lens.classList.add("settle")},70);
    var r=Math.round(p);
    if(r!==lastIdx||!tabEls[r].classList.contains("on")){
      lastIdx=r; tabEls.forEach(function(t,i){t.classList.toggle("on",i===r)});
      $("#title").textContent=TITLES[r];
    }
  }
  pages.addEventListener("scroll",function(){requestAnimationFrame(sync)},{passive:true});
  function goto(i){pages.scrollTo({left:i*pages.clientWidth,behavior:"smooth"})}

  /* drag a finger across the bar and the lens (and pages) follow */
  var startX=0,moved=false;
  function idxFromX(x){
    var r=tabs.getBoundingClientRect(), tw=(r.width-12)/4;
    return Math.max(0,Math.min(3,(x-r.left-6)/tw-.5));
  }
  tabs.addEventListener("pointerdown",function(e){
    dragging=true;moved=false;startX=e.clientX;tabs.setPointerCapture(e.pointerId);
    tabs.classList.add("drag");pages.style.scrollSnapType="none";
    pages.scrollLeft=idxFromX(e.clientX)*pages.clientWidth; // jump lens under finger
  });
  tabs.addEventListener("pointermove",function(e){
    if(!dragging)return; if(Math.abs(e.clientX-startX)>4)moved=true;
    pages.scrollLeft=idxFromX(e.clientX)*pages.clientWidth;
  });
  function end(e){
    if(!dragging)return; dragging=false; tabs.classList.remove("drag");
    var i=Math.round(idxFromX(e.clientX));
    pages.style.scrollSnapType=""; goto(i);
  }
  tabs.addEventListener("pointerup",end);
  tabs.addEventListener("pointercancel",end);
  tabs.addEventListener("click",function(e){ // keyboard activation
    var b=e.target.closest(".tab"); if(b&&e.detail===0)goto(+b.dataset.i);
  });
  /* rotating fires a burst of resize events: re-measure and re-align once it settles */
  var rzT;
  window.addEventListener("resize",function(){
    clearTimeout(rzT);
    rzT=setTimeout(function(){measure();pages.scrollLeft=lastIdx*(pageW||pages.clientWidth);sync()},140);
  });

  /* ---- list actions ---- */
  document.addEventListener("click",function(e){
    var b=e.target.closest("[data-a]"); if(!b)return;
    var el=b.closest(".item"), id=+el.dataset.id, it=items.filter(function(x){return x.id===id})[0]; if(!it)return;
    if(b.dataset.a==="toggle"){
      it.done=!it.done;it.doneAt=it.done?Date.now():0;
      persist();moveCard(it);syncAll();
      return;
    }
    items=items.filter(function(x){return x.id!==id});
    persist();render();syncAll();
  });

  /* ---- add sheet ---- */
  var sheet=$("#sheet"),scrim=$("#scrim"),ft=$("#f-title"),save=$("#save");
  $("#dots").innerHTML=COLORS.map(function(c,i){return '<button type="button" class="dot'+(i?'':' sel')+'" style="--c:'+c+'" data-c="'+c+'" aria-label="Color '+(i+1)+'"></button>'}).join("");
  $("#dots").addEventListener("click",function(e){
    var d=e.target.closest(".dot"); if(!d)return; color=d.dataset.c;
    [].forEach.call(document.querySelectorAll(".dot"),function(x){x.classList.toggle("sel",x===d)});
  });
  function openSheet(){
    var d=new Date(Date.now()+36e5);d.setMinutes(0,0,0);
    $("#f-due").value=localInput(d);ft.value="";$("#f-notes").value="";save.disabled=true;
    sheet.classList.add("open");scrim.classList.add("open");setTimeout(function(){ft.focus()},350);
    if("Notification" in window&&Notification.permission==="default"){try{Notification.requestPermission()}catch(e){}}
  }
  function closeSheet(){sheet.classList.remove("open");scrim.classList.remove("open");document.activeElement.blur()}
  $("#fab").onclick=openSheet;$("#cancel").onclick=closeSheet;scrim.onclick=closeSheet;
  ft.addEventListener("input",function(){save.disabled=!titleOf(ft.value)});
  ft.addEventListener("keydown",function(e){if(e.key==="Enter"&&!save.disabled)save.click()});
  document.addEventListener("keydown",function(e){if(e.key==="Escape")closeSheet()});
  save.onclick=function(){
    /* nothing to save: the sheet stays open and the field keeps the focus, rather than a card
       being written with a blank title */
    var title=titleOf(ft.value);
    if(!title){ save.disabled=true; ft.focus(); return; }
    var v=$("#f-due").value, due=v?new Date(v).getTime():0;
    var it={id:newId(),title:title,notes:$("#f-notes").value.trim(),due:due,color:color,done:false,fired:false};
    items.push(it);
    persist();render();closeSheet();syncAll();
    goto(due&&due>endOfToday()?1:0);
  };

  /* ---- alerts while the app is open (no internet needed) ---- */
  var toast=$("#toast"),tt;
  /* the store refused a write (full quota, private mode, storage turned off): say so on the
     toast the due alerts already use, so the change is never dropped without a word */
  function saveFailed(e){
    var name=(e&&e.name)||"", code=e&&e.code;
    var full=name==="QuotaExceededError"||name==="NS_ERROR_DOM_QUOTA_REACHED"||code===22||code===1014;
    $("#t-title").textContent=full?"Not saved":"Couldn't save";
    $("#t-sub").textContent=full?"Storage is full. Free some space and try again."
                               :"The change could not be saved.";
    toast.classList.add("show");clearTimeout(tt);tt=setTimeout(function(){toast.classList.remove("show")},6000);
    try{ console.info("[store] write refused ("+(name||"unknown")+")"); }catch(e2){}
  }
  function alertFor(it){
    $("#t-title").textContent=it.title;$("#t-sub").textContent="Reminder is due now";
    toast.classList.add("show");clearTimeout(tt);tt=setTimeout(function(){toast.classList.remove("show")},6000);
    if(navigator.vibrate)try{navigator.vibrate([120,60,120])}catch(e){}
    if("Notification" in window&&Notification.permission==="granted"){try{new Notification("Reminder",{body:it.title})}catch(e){}}
  }
  toast.onclick=function(){toast.classList.remove("show")};
  function tick(){
    var now=Date.now(),hit=false;
    items.forEach(function(it){if(!it.done&&!it.fired&&it.due&&it.due<=now){it.fired=true;hit=true;alertFor(it)}});
    if(hit){persist();render()}
    schedule();
  }
  /* one timer that wakes exactly at the next due reminder, instead of polling every 15 s */
  var tickT;
  function nextDue(){
    var best=0;
    items.forEach(function(it){if(!it.done&&!it.fired&&it.due&&(!best||it.due<best))best=it.due});
    return best;
  }
  function schedule(){
    clearTimeout(tickT);tickT=0;
    var t=nextDue();
    if(!t)return;
    tickT=setTimeout(function(){tickT=0;tick()},Math.min(Math.max(0,t-Date.now())+60,2147483647));
  }
  document.addEventListener("visibilitychange",function(){
    document.documentElement.classList.toggle("paused",document.hidden);
    if(!document.hidden){tick();render()}
  });

  /* ---- first-paint marker: one console line per load, so a run can compare before and
     after. It only reads timings and writes to the console; nothing on screen is touched. ---- */
  var tRender=0, tFrame=0, marked=false;
  function paintEntry(){
    var t=0;
    if(window.performance&&performance.getEntriesByType){
      try{ performance.getEntriesByType("paint").forEach(function(e){
        if(e.name==="first-contentful-paint") t=e.startTime;
      }); }catch(e){}
    }
    return t;
  }
  function markFirstPaint(){
    if(marked)return; marked=true;
    var fcp=paintEntry();
    var m={boot:Math.round(__tBoot),render:Math.round(tRender),frame:Math.round(tFrame||tRender),fcp:Math.round(fcp)};
    window.__firstPaint=m;
    try{ console.info("[perf] first paint: boot "+m.boot+"ms, first render "+m.render+"ms, first frame "+m.frame+"ms, fcp "+(fcp?m.fcp+"ms":"n/a")); }catch(e){}
  }
  /* the paint entry lands a beat after the first frame: take it the moment it arrives, and
     stop waiting after 3 s so a browser that never reports one still writes the line */
  if(window.PerformanceObserver){
    try{
      var paintObs=new PerformanceObserver(function(){markFirstPaint();paintObs.disconnect()});
      paintObs.observe({type:"paint",buffered:true});
    }catch(e){}
  }
  var paintWait=0;
  (function awaitPaint(){
    if(marked)return;
    if(paintEntry())return markFirstPaint();
    if(paintWait>=3000)return markFirstPaint();
    paintWait+=100;setTimeout(awaitPaint,100);
  })();

  /* specular light follows the finger / cursor */
  if(window.chrome)document.documentElement.classList.add("refract");
  /* specular highlight: coalesce pointer events to one layout read per frame */
  var specPending=false,specEvt=null;
  /* will-change pins a compositor layer, so it is carried only while the highlight is moving:
     litOn() adds it with the first move, litOff() drops it after the .35 s fade-out */
  var litEl=null;
  function litOn(g){
    if(litEl&&litEl!==g)litOff(litEl);
    if(g._litT){clearTimeout(g._litT);g._litT=0}
    g.classList.add("lit");litEl=g;
  }
  function litOff(g){
    if(!g)return;
    if(g._litT)clearTimeout(g._litT);
    g._litT=setTimeout(function(){g._litT=0;g.classList.remove("lit");if(litEl===g)litEl=null},420);
  }
  document.addEventListener("pointermove",function(e){
    specEvt=e;
    if(specPending)return;
    specPending=true;
    requestAnimationFrame(function(){
      specPending=false;
      var ev=specEvt;if(!ev)return;
      var g=ev.target.closest&&ev.target.closest(".glass");if(!g)return;
      var r=g.getBoundingClientRect();
      g.style.setProperty("--mx",(ev.clientX-r.left)+"px");g.style.setProperty("--my",(ev.clientY-r.top)+"px");g.style.setProperty("--lit",1);
      litOn(g);
    });
  });
  document.addEventListener("pointerout",function(e){
    var g=e.target.closest&&e.target.closest(".glass");if(!g)return;
    g.style.removeProperty("--lit");litOff(g);
  });

  render();sync();tick();syncAll();if(BR)BR.askNotifications();
  tRender=performance.now();
  requestAnimationFrame(function(){requestAnimationFrame(function(){tFrame=performance.now()})});
})();
</script>

<script>
/* ---- depth bounce driver ---- */
(function(){
  var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  var pressed = null;

  /* press: lift the card toward the viewer and tilt it toward the finger */
  document.addEventListener('pointerdown', function(e){
    var it = e.target.closest && e.target.closest('.item');
    if(!it || reduce) return;
    /* the browser already measured offsetX/offsetY against the event target, so the
       press point costs no layout read; walk the offsets up into the card's own box */
    var ox = e.offsetX, oy = e.offsetY, n = e.target;
    while(n && n !== it){ ox += n.offsetLeft; oy += n.offsetTop; n = n.offsetParent; }
    var w = it.offsetWidth, h = it.offsetHeight;
    var px = w ? ox / w : .5;
    var py = h ? oy / h : .5;
    it.style.setProperty('--ry', ((px - .5) * -8).toFixed(2) + 'deg');
    it.style.setProperty('--rx', ((py - .5) * 7).toFixed(2) + 'deg');
    it.classList.remove('bounce');
    it.classList.add('press');
    pressed = it;
  }, {passive:true});

  function release(){
    if(!pressed) return;
    var it = pressed; pressed = null;
    it.classList.remove('press');
    if(!reduce) it.classList.add('bounce');
  }
  document.addEventListener('pointerup', release, {passive:true});
  document.addEventListener('pointercancel', release, {passive:true});

  /* cards cascade in from depth whenever the list is rebuilt */
  var pagesEl = document.getElementById('pages');
  if(pagesEl && window.MutationObserver){
    new MutationObserver(function(muts){
      if(reduce) return;
      muts.forEach(function(m){
        var i = 0;
        Array.prototype.forEach.call(m.addedNodes, function(n){
          if(!n.classList || !n.classList.contains('item')) return;
          n.style.animationDelay = Math.min(i++, 7) * 38 + 'ms';
          n.classList.add('cascade');
          n.addEventListener('animationend', function h(){
            n.classList.remove('cascade');
            n.style.animationDelay = '';
            n.removeEventListener('animationend', h);
          });
        });
      });
    }).observe(pagesEl, {childList:true, subtree:true});
  }

  /* the add button pushes away, then springs past rest */
  var fab = document.getElementById('fab');
  if(fab){
    fab.addEventListener('pointerdown', function(){
      if(reduce) return;
      fab.classList.remove('bounce');
      fab.classList.add('press');
    }, {passive:true});
    ['pointerup','pointercancel','pointerleave'].forEach(function(t){
      fab.addEventListener(t, function(){
        if(reduce || !fab.classList.contains('press')) return;
        fab.classList.remove('press');
        fab.classList.add('bounce');
      }, {passive:true});
    });
    fab.addEventListener('animationend', function(){ fab.classList.remove('bounce'); });
  }

  /* the lens dips and springs back each time a tab settles */
  var lensEl = document.querySelector('.lens');
  if(pagesEl && lensEl){
    var lastIdx = -1;
    pagesEl.addEventListener('scroll', function(){
      var w = pagesEl.clientWidth || 1;
      var idx = Math.round(pagesEl.scrollLeft / w);
      if(idx === lastIdx) return;
      lastIdx = idx;
      if(reduce) return;
      lensEl.classList.remove('bounce');
      void lensEl.offsetWidth;              /* restart the animation */
      lensEl.classList.add('bounce');
    }, {passive:true});
    lensEl.addEventListener('animationend', function(){ lensEl.classList.remove('bounce'); });
  }
})();
</script>

<script>
/* ---- parallax engine + settings ---- */
(function(){
  var root = document.documentElement;
  var KEY = 'liquid.settings.v1';
  var st = { depth: 100, par: 70, tilt: true };

  try{
    var saved = JSON.parse(localStorage.getItem(KEY) || 'null');
    if(saved && typeof saved === 'object'){
      if(typeof saved.depth === 'number') st.depth = saved.depth;
      if(typeof saved.par   === 'number') st.par   = saved.par;
      if(typeof saved.tilt  === 'boolean') st.tilt = saved.tilt;
    }
  }catch(e){}

  function save(){ try{ localStorage.setItem(KEY, JSON.stringify(st)); }catch(e){} }

  var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;

  function apply(){
    root.style.setProperty('--d', (st.depth / 100).toFixed(2));
    root.style.setProperty('--par', reduce ? '0' : (st.par / 100).toFixed(2));
    root.style.setProperty('--tilt', st.tilt && !reduce ? '1' : '0');
  }
  apply();

  /* ---- motion source: device tilt if we have it, otherwise the pointer ---- */
  var tx = 0, ty = 0, cx = 0, cy = 0, running = true, seenOrient = false;

  window.addEventListener('deviceorientation', function(e){
    if(e.beta == null && e.gamma == null) return;
    seenOrient = true;
    var g = Math.max(-45, Math.min(45, e.gamma || 0));
    var b = Math.max(-45, Math.min(45, (e.beta || 0) - 35));
    tx = g / 45;
    ty = b / 45;
    kick();
  }, {passive:true});

  document.addEventListener('pointermove', function(e){
    if(seenOrient) return;
    tx = (e.clientX / (window.innerWidth || 1) - .5) * 2;
    ty = (e.clientY / (window.innerHeight || 1) - .5) * 2;
    kick();
  }, {passive:true});

  /* a sheet owns the screen while it is open, so the parallax is pointless there:
     park the loop instead of animating behind the scrim */
  var addSheetEl = document.getElementById('sheet');
  var setSheetEl = document.getElementById('settings');
  function sheetOpen(){
    return !!((addSheetEl && addSheetEl.classList.contains('open')) ||
              (setSheetEl && setSheetEl.classList.contains('open')));
  }

  function kick(){
    if(sheetOpen()) return;
    if(!running){ running = true; requestAnimationFrame(loop); }
  }

  function loop(){
    if(sheetOpen()){ running = false; return; }   /* sheet open: no frames */
    cx += (tx - cx) * .12;
    cy += (ty - cy) * .12;
    var settled = Math.abs(tx - cx) < .0008 && Math.abs(ty - cy) < .0008;
    if(settled){ cx = tx; cy = ty; }
    root.style.setProperty('--px', cx.toFixed(4));
    root.style.setProperty('--py', cy.toFixed(4));
    if(settled){ running = false; return; }   /* idle: stop burning frames */
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);

  /* ---- settings sheet ---- */
  var sheet = document.getElementById('settings');
  var scrim = document.getElementById('scrim');
  var gear  = document.getElementById('gear');
  var depth = document.getElementById('s-depth');
  var par   = document.getElementById('s-par');
  var oDepth = document.getElementById('o-depth');
  var oPar   = document.getElementById('o-par');
  var tiltBtn = document.getElementById('s-tilt');
  if(!sheet || !gear) return;

  function paint(){
    depth.value = st.depth;
    par.value = st.par;
    oDepth.textContent = st.depth + '%';
    oPar.textContent = st.par + '%';
    tiltBtn.classList.toggle('on', !!st.tilt);
    tiltBtn.setAttribute('aria-checked', st.tilt ? 'true' : 'false');
  }
  paint();

  function open(){
    var add = document.getElementById('sheet');
    if(add) add.classList.remove('open');
    sheet.classList.add('open');
    scrim.classList.add('open');
  }
  function close(){
    sheet.classList.remove('open');
    scrim.classList.remove('open');
  }

  gear.addEventListener('click', open);
  document.getElementById('s-done').addEventListener('click', close);
  scrim.addEventListener('click', close);
  document.addEventListener('keydown', function(e){ if(e.key === 'Escape') close(); });

  depth.addEventListener('input', function(){
    st.depth = +depth.value; oDepth.textContent = st.depth + '%'; apply(); save();
  });
  par.addEventListener('input', function(){
    st.par = +par.value; oPar.textContent = st.par + '%'; apply(); save();
  });
  tiltBtn.addEventListener('click', function(){
    st.tilt = !st.tilt; paint(); apply(); save();
    tx = ty = 0; kick();
  });
  document.getElementById('s-reset').addEventListener('click', function(){
    st = { depth: 100, par: 70, tilt: true };
    paint(); apply(); save(); tx = ty = 0; kick();
  });
})();
</script>
</body>
</html>
