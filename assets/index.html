<!DOCTYPE html>
<!--
  THE BRIDGE CONTRACT
  ===================
  This file is the whole interface, and the native shell's only way in. In the app,
  MainActivity (java/com/liquid/reminders/MainActivity.java) attaches a JavascriptInterface
  named "AndroidBridge", implemented by its inner Bridge class; in a plain browser
  window.AndroidBridge is undefined, every call to it is guarded, and the page runs on its own
  with the list in localStorage. Nothing here is required for the page to draw.

  PAGE -> NATIVE   (window.AndroidBridge, present only inside the app)

    schedule(id, title, notes, dueMillis)
        Register one exact alarm for one reminder. dueMillis is milliseconds since the epoch,
        0 meaning "no date", which never fires. The shell replaces any existing alarm for the
        same id.

    cancel(id)
        Drop the alarm held for one reminder id.

    resync(json)
        The whole list at once, as a JSON array of {id, title, notes, due, done}. The shell
        rebuilds every alarm from the array, so a reminder missing from it loses its alarm.
        The page calls this from syncAll() after every add, toggle and delete, and it is what
        keeps the native store and the alarm schedule in step with what is on screen.

    askNotifications()
        Ask for POST_NOTIFICATIONS on Android 13 and newer; a no-op below that, and a no-op
        once the question has been answered.

    now() -> long
        The device clock, in milliseconds since the epoch.

    Only resync() and askNotifications() are called today: the page hands over the whole list
    rather than scheduling one reminder at a time, so schedule() and cancel() stay part of the
    interface but are not used by this file.

  NATIVE -> PAGE   (globals and CSS custom properties the shell sets on this document)

    window.LiquidBack() -> boolean
        Called when the Android Back button is pressed. Closes whichever sheet is open (Add or
        Settings) by clicking its own dismiss control, and returns true only if it closed one.
        A false answer is the shell's cue to leave the app.

    window.LiquidNotifyHint()
        Called once the notification permission answer is known, when notifications are
        refused, so the page can say so in its own toast. It shows once per install and then
        does nothing.

    --sat and --sab   (CSS px, set on document.documentElement)
        Status bar and navigation/IME insets, re-measured by the shell on every inset change.
        The layout reads them as var(--sat, env(safe-area-inset-top, 0px)) and the matching
        --sab, so the same rules still hold in a browser with no shell.

  Keep this file self-contained: no other asset is loaded, nothing is fetched over a network,
  and the names above are the entire surface either side may rely on.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<script>/* first-paint marker: stamp the moment parsing starts, so the marker at the end of the
   page can report boot, first render and first painted frame in one line */
var __tBoot=(window.performance&&performance.now)?performance.now():0;</script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1b1f4b">
<title>Reminders</title>
<style>
:root{
  --edge:rgba(255,255,255,.7); --shade:rgba(40,30,90,.18);
  --bg1:#ffb3c7; --bg2:#a9c4ff; --bg3:#b9f0d8; --bg4:#ffe0a3;
  /* the reminder palette is spelled once, here. The script reads these five values back out
     of the stylesheet, so a palette colour is never written down twice in this file. */
  --c1:#0a84ff; --c2:#ff375f; --c3:#30d158; --c4:#ff9f0a; --c5:#bf5af2;
  --accent:var(--c1); --danger:#ff453a;
  /* motion: every duration, delay and easing curve the animations below spend is named here
     once, so the numbers live in one place instead of inside the rules that use them */
  --dur-float:22s; --ease-float:ease-in-out;
  --dur-drift:18s; --ease-drift:ease-in-out;
  --delay-blob-2:-8s; --delay-blob-3:-14s;
  --delay-orb-2:-6s; --delay-orb-3:-11s;
  --dur-pop:.35s; --ease-pop:cubic-bezier(.2,.9,.3,1.2);
  --dur-check-bg:.25s; --dur-check-press:.2s;
  --dur-tab:.2s; --dur-lit:.35s;
  --dur-scrim:.3s;
  --dur-sheet-close:.45s; --ease-sheet-close:cubic-bezier(.2,.9,.25,1);
  --dur-toast-in:.5s; --ease-toast-in:cubic-bezier(.2,.9,.25,1.1);
  --dur-item-tilt:.35s; --ease-item-tilt:cubic-bezier(.2,1.5,.4,1);
  --dur-settle:.55s; --ease-settle:cubic-bezier(.16,1.45,.32,1);
  --dur-item-filter:.3s;
  --dur-press:.13s; --ease-press:cubic-bezier(.25,.9,.3,1);
  --lift-press:38px;
  --dur-depth-bounce:.68s; --ease-depth-bounce:cubic-bezier(.3,.85,.3,1);
  --dur-cascade:.62s; --ease-cascade:cubic-bezier(.22,1.1,.32,1);
  --dur-tick:.5s; --ease-tick:cubic-bezier(.3,.9,.3,1); --tick-from:.35;
  --dur-fab-settle:.5s; --ease-fab-settle:cubic-bezier(.16,1.5,.3,1);
  --dur-fab-press:.12s; --push-fab:-26px;
  --dur-fab-bounce:.62s;
  --dur-lens-settle:.55s; --ease-lens-settle:cubic-bezier(.3,1.7,.4,1);
  --dur-lens-bounce:.58s;
  --dur-sheet:.6s; --ease-sheet:cubic-bezier(.18,1.25,.32,1);
  --dur-toast:.55s; --ease-toast:cubic-bezier(.18,1.4,.32,1);
  --dur-switch-bg:.25s; --dur-switch-knob:.32s; --ease-switch-knob:cubic-bezier(.2,1.4,.3,1);
  --dur-reduced:.18s;
  --font:ui-rounded,"SF Pro Rounded","SF Pro Display",-apple-system,"Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --edge:rgba(255,255,255,.38); --shade:rgba(0,0,0,.45);
    --bg1:#6a2a6e; --bg2:#1f3b9c; --bg3:#0b6a6a; --bg4:#8a4a1c;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
/* the shell already renders the page at the user's OS text size (WebView text zoom follows the
   system font scale), so the browser's own text autosizing must not inflate it a second time on
   top of that: pinning text-size-adjust to 100% makes the OS setting the only scale factor and
   keeps the layout measurable */
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{font-family:var(--font);color:var(--ink);background:var(--bg2);overflow:hidden;}
button,input{font:inherit;color:inherit}
button{border:0;background:none;cursor:pointer}

/* living background the glass refracts */
.bg{position:fixed;inset:0;z-index:0;overflow:hidden;background:linear-gradient(160deg,var(--bg1),var(--bg2) 55%,var(--bg3))}
.blob{position:absolute;border-radius:50%;filter:blur(40px);opacity:.9;animation:float var(--dur-float) var(--ease-float) infinite alternate}
.b1{width:60vmax;height:60vmax;left:-20vmax;top:-12vmax;background:var(--bg4)}
.b2{width:50vmax;height:50vmax;right:-18vmax;top:30%;background:var(--bg1);animation-delay:var(--delay-blob-2)}
.b3{width:55vmax;height:55vmax;left:5vmax;bottom:-25vmax;background:var(--bg3);animation-delay:var(--delay-blob-3)}
@keyframes float{to{transform:translate(8vmax,-6vmax) scale(1.15)}}
@media (prefers-reduced-motion:reduce){.blob{animation:none}}

/* the glass material */
.glass{
  background:linear-gradient(135deg,var(--g1),var(--g2));
  -webkit-backdrop-filter:blur(26px) saturate(190%) brightness(1.05);
  border:1px solid var(--edge);
}

.app{position:relative;z-index:1;height:100%;display:flex;flex-direction:column;max-width:560px;margin:0 auto}
header{padding:22px 24px 6px}
header h1{margin:0;}
header p{margin:2px 0 0;color:var(--ink2);}

.pages{flex:1;display:flex;overflow-y:hidden;scroll-snap-type:x mandatory;
  scrollbar-width:none;overscroll-behavior-x:contain}
.pages::-webkit-scrollbar{display:none}
.page{flex:0 0 100%;scroll-snap-align:start;scroll-snap-stop:always;overflow-y:auto;
  content-visibility:auto;
  padding:12px 16px 190px;display:flex;flex-direction:column;gap:10px;align-content:flex-start;scrollbar-width:none}
.page::-webkit-scrollbar{display:none}

.item{display:flex;align-items:center;gap:12px;padding:13px 14px;border-radius:24px;animation:pop var(--dur-pop) var(--ease-pop)}
@keyframes pop{from{opacity:0;transform:scale(.94) translateY(6px)}}
.check{flex:none;width:28px;height:28px;border-radius:50%;border:2px solid var(--c);
  display:grid;place-items:center;transition:background var(--dur-check-bg),transform var(--dur-check-press)}
.check:active{transform:scale(.88)}
.item.done .check{background:var(--c)}
.item.done .check::after{content:"";width:7px;height:12px;border:solid #fff;border-width:0 2.5px 2.5px 0;transform:translateY(-1px) rotate(45deg)}
.txt{flex:1;min-width:0}
.txt b{display:block;font-size:17px;overflow-wrap:anywhere}
.item.done .txt b{text-decoration:line-through;opacity:.5}
.txt small{display:block;margin-top:2px;color:var(--ink2);overflow-wrap:anywhere}
.del{flex:none;width:34px;height:34px;border-radius:50%;line-height:1;position:relative}
/* the circle stays 34px, but an invisible 44px square sits around it, so the
   touch target clears the 44px minimum without moving or resizing anything */
.del::after{content:"";position:absolute;left:50%;top:50%;width:44px;height:44px;margin:-22px 0 0 -22px}
.del:hover{background:rgba(255,255,255,.3)}
.empty{margin:auto;padding:60px 20px;text-align:center;line-height:1.45}
.empty span{display:block;font-size:44px;margin-bottom:8px}

/* floating glass tab bar with sliding lens */
.dock{position:fixed;left:0;right:0;z-index:5;display:flex;
  flex-direction:column;align-items:center;gap:12px;pointer-events:none}
.fab{pointer-events:auto;align-self:flex-end;margin-right:max(20px,calc(50% - 260px));width:58px;height:58px;border-radius:50%;
  font-size:32px;font-weight:300;display:grid;place-items:center;}
.fab:active{transform:scale(.9)}
.tabs{pointer-events:auto;position:relative;width:min(92vw,520px);display:flex;padding:6px;border-radius:999px;
  touch-action:pan-y;user-select:none;-webkit-user-select:none;cursor:grab;}
.lens{position:absolute;top:6px;bottom:6px;width:calc((100% - 12px)/4);border-radius:999px;
  -webkit-backdrop-filter:blur(6px) saturate(220%) brightness(1.18);backdrop-filter:blur(6px) saturate(220%) brightness(1.18);
  border:1px solid rgba(255,255,255,.85);}
.tabs.drag .lens{--s:1.14}
.tabs.drag{cursor:grabbing}
.tab{position:relative;z-index:1;flex:1;min-width:0;padding:9px 0 7px;border-radius:999px;
  color:var(--ink2);display:flex;flex-direction:column;align-items:center;gap:2px;transition:color var(--dur-tab)}
/* at a large OS text size "Upcoming" is wider than a quarter of the bar: the four labels then
   wrap inside their own tab instead of pushing the bar past the screen edge. At the default size
   every label already fits on one line, so nothing here is visible until the text is enlarged. */
.tab{overflow-wrap:anywhere}
.tab svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.tab i{position:absolute;top:4px;right:calc(50% - 22px);min-width:17px;height:17px;border-radius:9px;background:var(--danger);
  color:#fff;font:700 10.5px/17px var(--font);text-align:center;font-style:normal;padding:0 4px}
.tab i:empty{display:none}

/* add sheet */
.scrim{position:fixed;inset:0;z-index:8;background:rgba(10,10,30,.28);opacity:0;pointer-events:none;transition:opacity var(--dur-scrim)}
.scrim.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:50%;bottom:0;z-index:9;width:min(100%,560px);transform:translate(-50%,105%);
  transition:transform var(--dur-sheet-close) var(--ease-sheet-close);border-radius:34px 34px 0 0;padding:20px 20px calc(24px + env(safe-area-inset-bottom,0px))}
.sheet.open{transform:translate(-50%,0)}
.sheet h2{margin:0 0 14px;font-size:22px;font-weight:800;text-align:center}
.field{width:100%;padding:14px 16px;margin-bottom:10px;border-radius:18px;border:1px solid var(--edge);
  background:rgba(255,255,255,.28);outline:none;font-size:16.5px;font-weight:600}
.field::placeholder{color:var(--ink2)}
.field:focus{box-shadow:0 0 0 3px rgba(10,132,255,.45)}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:4px 2px 16px;
  flex-wrap:wrap}
.dots{display:flex;gap:10px}
.dot{width:30px;height:30px;border-radius:50%;background:var(--c);border:3px solid transparent;
  box-shadow:inset 0 1px 2px rgba(255,255,255,.7)}
.dot.sel{border-color:#fff;transform:scale(1.12)}
.btns{display:flex;gap:10px}
.btn{flex:1;padding:15px;border-radius:999px;font-weight:800;font-size:16.5px}
.btn.pri{background:var(--accent);color:#fff;box-shadow:inset 0 1.5px 0 rgba(255,255,255,.5),0 6px 18px rgba(10,132,255,.4)}
.btn.sec{border:1px solid var(--edge);background:rgba(255,255,255,.25)}
.btn:disabled{opacity:.45}

/* in-app alert banner */
.toast{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));left:50%;z-index:20;width:min(92vw,420px);
  transform:translate(-50%,-160%);transition:transform var(--dur-toast-in) var(--ease-toast-in);padding:14px 18px;border-radius:26px}
.toast.show{transform:translate(-50%,0)}
.toast b{display:block;font-size:15px}.toast span{font-size:14px;color:var(--ink2);font-weight:600}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

/* ---- more liquid glass ---- */
.item.glass,.fab.glass{position:relative}
.glass::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1.5px;pointer-events:none;
  background:conic-gradient(from 210deg,rgba(255,255,255,.95),rgba(255,255,255,.04) 25%,rgba(255,255,255,.55) 50%,rgba(255,255,255,.04) 75%,rgba(255,255,255,.95));
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude}
.glass::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:radial-gradient(170px circle at var(--mx,22%) var(--my,0%),rgba(255,255,255,.55),transparent 62%);
  opacity:var(--lit,.5);transition:opacity var(--dur-lit)}
/* keep the specular highlight on its own compositor layer while it moves: moving it repaints
   that layer alone instead of dirtying the card, so the card's backdrop-filter is not re-run
   on every pointermove. The class goes on with the first move and comes off once the fade-out
   has finished, so a card that is not animating pins no layer. */
.glass.lit::after{will-change:opacity}
.orb{position:absolute;border-radius:50%;animation:drift var(--dur-drift) var(--ease-drift) infinite alternate;
  background:radial-gradient(circle at 30% 25%,rgba(255,255,255,.95),rgba(255,255,255,.18) 38%,rgba(255,255,255,.04) 72%);
  box-shadow:inset -8px -10px 24px rgba(255,255,255,.28),0 22px 40px rgba(30,20,90,.16)}
.o1{width:92px;height:92px;left:10%;top:24%}
.o2{width:56px;height:56px;right:12%;top:46%;animation-delay:var(--delay-orb-2)}
.o3{width:124px;height:124px;left:56%;bottom:20%;animation-delay:var(--delay-orb-3)}
@keyframes drift{to{transform:translate(34px,-56px) rotate(25deg)}}
@media (prefers-reduced-motion:reduce){.orb{animation:none}}
/* background motion parks while the app is backgrounded */
html.paused .blob,html.paused .orb{animation-play-state:paused}
.item{transition:transform var(--dur-item-tilt) var(--ease-item-tilt)}
.item:active{transform:scale(.97)}
.field{box-shadow:inset 0 2px 7px rgba(0,0,0,.12),inset 0 1px 0 rgba(255,255,255,.65)}
.tab.on svg{filter:drop-shadow(0 0 6px rgba(10,132,255,.65))}
.tabs{box-shadow:inset 0 1.5px 0 rgba(255,255,255,.8),inset 0 -2px 6px rgba(255,255,255,.18),0 18px 40px var(--shade)}
.lens{
  box-shadow:inset 0 2px 3px rgba(255,255,255,.95),inset 3px 0 7px rgba(255,110,200,.38),inset -3px 0 7px rgba(80,210,255,.4),
             inset 0 -4px 10px rgba(255,255,255,.3),0 6px 18px rgba(30,20,90,.28);
  transform:translateX(calc(var(--p)*100%)) scale(calc(var(--s,1)*var(--sx,1)),calc(var(--s,1)*(2 - var(--sx,1))))}
.lens::after{content:"";position:absolute;left:14%;right:14%;top:4px;height:38%;border-radius:999px;
  background:linear-gradient(180deg,rgba(255,255,255,.85),rgba(255,255,255,0))}
.lens.settle{transition:transform var(--dur-lens-settle) var(--ease-lens-settle)}
.tabs.drag .lens{background:linear-gradient(180deg,rgba(255,255,255,.36),rgba(255,255,255,.06))}
.refract .lens{-webkit-backdrop-filter:url(#lg) blur(1px) saturate(230%) brightness(1.2);backdrop-filter:url(#lg) blur(1px) saturate(230%) brightness(1.2)}
.refract .tabs.drag .lens{-webkit-backdrop-filter:url(#lg) saturate(250%) brightness(1.25);backdrop-filter:url(#lg) saturate(250%) brightness(1.25)}

/* ---- extra transparent ---- */
.glass{-webkit-backdrop-filter:blur(12px) saturate(170%) brightness(1.04);backdrop-filter:blur(12px) saturate(170%) brightness(1.04);
  border-color:rgba(255,255,255,.5)}
.sheet.glass{-webkit-backdrop-filter:blur(22px) saturate(180%);backdrop-filter:blur(22px) saturate(180%)}
.field{background:rgba(255,255,255,.1)}
.btn.sec{background:rgba(255,255,255,.08)}
.btn.pri{background:rgba(10,132,255,.78)}
.lens{background:linear-gradient(180deg,rgba(255,255,255,.34),rgba(255,255,255,.05))}
.tabs.drag .lens{background:linear-gradient(180deg,rgba(255,255,255,.2),rgba(255,255,255,.01))}
.orb{opacity:.95}
.txt b{text-shadow:0 1px 10px rgba(255,255,255,.35)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .txt b{text-shadow:0 1px 8px rgba(0,0,0,.35)}}

/* ---- fully clear glass ---- */
:root{--g1:rgba(255,255,255,.07);--g2:rgba(255,255,255,0)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--g1:rgba(255,255,255,.05);--g2:rgba(255,255,255,0)}}
.glass{-webkit-backdrop-filter:blur(.6px) saturate(140%) brightness(1.06);backdrop-filter:blur(.6px) saturate(140%) brightness(1.06);
  border-color:rgba(255,255,255,.7);
  box-shadow:inset 0 1.5px 0 rgba(255,255,255,.9),inset 0 -1px 0 rgba(255,255,255,.35),
             inset 0 0 22px rgba(255,255,255,.22),inset 0 0 2px rgba(255,255,255,.7),0 10px 28px rgba(30,20,90,.12)}
.sheet.glass{-webkit-backdrop-filter:blur(4px) saturate(150%);backdrop-filter:blur(4px) saturate(150%)}
.refract .glass{-webkit-backdrop-filter:url(#lg) blur(.5px) saturate(140%) brightness(1.05);backdrop-filter:url(#lg) blur(.5px) saturate(140%) brightness(1.05)}
.refract .sheet.glass{-webkit-backdrop-filter:blur(4px) saturate(150%);backdrop-filter:blur(4px) saturate(150%)}
.field{background:rgba(255,255,255,.04);border-color:rgba(255,255,255,.55)}
.btn.sec{background:rgba(255,255,255,.03)}
.lens{background:linear-gradient(180deg,rgba(255,255,255,.18),rgba(255,255,255,0))}
.tabs.drag .lens{background:rgba(255,255,255,.02)}
.txt b,.txt small,header h1,header p,.sheet h2,.tab{text-shadow:0 0 10px rgba(255,255,255,.55),0 1px 2px rgba(255,255,255,.4)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .txt b,:root:not([data-theme="light"]) .txt small,:root:not([data-theme="light"]) header h1,:root:not([data-theme="light"]) header p,:root:not([data-theme="light"]) .sheet h2,:root:not([data-theme="light"]) .tab{text-shadow:0 0 10px rgba(0,0,0,.5),0 1px 2px rgba(0,0,0,.4)}}

/* ---- fully readable text ---- */
:root{--ink:#070914;--ink2:rgba(7,9,20,.86);--late:#d70015;
  --halo:0 0 2px rgba(255,255,255,.95),0 0 6px rgba(255,255,255,.9),0 0 14px rgba(255,255,255,.7),0 0 26px rgba(255,255,255,.4)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ink:#ffffff;--ink2:rgba(255,255,255,.9);--late:#ff7a72;
  --halo:0 0 2px rgba(0,0,0,.95),0 0 6px rgba(0,0,0,.85),0 0 14px rgba(0,0,0,.6),0 0 26px rgba(0,0,0,.35)}}
body{-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
header h1{font-size:38px;font-weight:900;letter-spacing:-.5px}
header p{font-size:16px;font-weight:700}
.txt b{font-size:18.5px;font-weight:800;line-height:1.25}
.txt small{font-size:15px;font-weight:700;line-height:1.3}
.txt small.late{color:var(--late)}
.tab{font-size:12.5px;font-weight:800;letter-spacing:.1px}
.tab.on{color:#0060d6}
.sheet h2{font-size:24px;font-weight:900}
.field{font-size:17.5px;font-weight:700;color:var(--ink)}
.field::placeholder{color:var(--ink2);opacity:1}
.btn{font-weight:900}
.btn.sec{color:var(--ink)}
.empty{font-size:17px;font-weight:800;color:var(--ink)}
.del{color:var(--ink);font-size:24px;font-weight:700}
.txt b,.txt small,header h1,header p,.sheet h2,.tab,.empty,.del,.row span{text-shadow:var(--halo)}
.toast b,.toast span{text-shadow:var(--halo)}
.toast span{color:var(--ink)}
.field,.btn{text-shadow:var(--halo)}
.btn.pri{text-shadow:0 1px 3px rgba(0,0,0,.45)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .tab.on{color:#5ab0ff}
:root:not([data-theme="light"]) .txt b,:root:not([data-theme="light"]) .txt small,:root:not([data-theme="light"]) header h1,:root:not([data-theme="light"]) header p,:root:not([data-theme="light"]) .sheet h2,:root:not([data-theme="light"]) .tab{text-shadow:var(--halo)}}

/* ---- android shell ---- */
html,body{overscroll-behavior:none}
body{padding-top:var(--sat,env(safe-area-inset-top,0px))!important;padding-bottom:0!important}
.dock{bottom:calc(14px + var(--sab,env(safe-area-inset-bottom,0px)))}
.sheet{padding-bottom:calc(24px + var(--sab,env(safe-area-inset-bottom,0px)))}
/* --dockh is the floating bar's measured height (142px at the default text size, where 190px
   already leaves room for it). At a large OS text size the tab labels wrap and the bar grows,
   so the last card still has to be able to scroll clear of it. */
.page{padding-bottom:calc(max(190px,var(--dockh,142px) + 48px) + var(--sab,0px))}

/* ============================================================
   depth bounce + 4D press
   Cards live in a 3D space: pressing lifts them toward the
   viewer, tilts them toward the finger, then releases through
   an overshoot spring that settles back to rest.
   ============================================================ */
.page{perspective:1000px;perspective-origin:50% 35%}

.item{
  transform-style:preserve-3d;
  transform:translateZ(0) rotateX(0deg) rotateY(0deg) scale(1);
  transition:transform var(--dur-settle) var(--ease-settle),
             box-shadow var(--dur-settle) var(--ease-settle),
             filter var(--dur-item-filter) ease;
}
.item.press{
  transition-duration:var(--dur-press);
  transition-timing-function:var(--ease-press);
  transform:translateZ(calc(var(--lift-press) * var(--d))) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg)) scale(1.035);
  box-shadow:0 30px 52px rgba(30,20,90,.32),
             inset 0 1.5px 0 rgba(255,255,255,.95),
             inset 0 0 26px rgba(255,255,255,.28);
  filter:brightness(1.06);
  z-index:3;
}
@keyframes depthBounce{
  0%  {transform:translateZ(calc(var(--lift-press) * var(--d))) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg)) scale(1.035)}
  34% {transform:translateZ(calc(-10px * var(--d))) rotateX(calc(var(--rx,0deg) * -.45)) rotateY(calc(var(--ry,0deg) * -.45)) scale(.978)}
  58% {transform:translateZ(calc(17px * var(--d))) rotateX(calc(var(--rx,0deg) * .3)) rotateY(calc(var(--ry,0deg) * .3)) scale(1.014)}
  78% {transform:translateZ(calc(-4px * var(--d))) rotateX(calc(var(--rx,0deg) * -.12)) rotateY(calc(var(--ry,0deg) * -.12)) scale(.996)}
  100%{transform:translateZ(0) rotateX(0deg) rotateY(0deg) scale(1)}
}
.item.bounce{animation:depthBounce var(--dur-depth-bounce) var(--ease-depth-bounce) both}

/* cards fly in from depth, one after another */
@keyframes cascadeIn{
  0%  {opacity:0;transform:translateZ(calc(-130px * var(--d))) translateY(16px) rotateX(7deg) scale(.93)}
  55% {opacity:1;transform:translateZ(calc(22px * var(--d))) translateY(-3px) rotateX(-1.4deg) scale(1.012)}
  78% {transform:translateZ(calc(-6px * var(--d))) translateY(1px) rotateX(.5deg) scale(.998)}
  100%{opacity:1;transform:translateZ(0) translateY(0) rotateX(0) scale(1)}
}
.item.cascade{animation:cascadeIn var(--dur-cascade) var(--ease-cascade) both}

/* the tick lands with its own little pop */
@keyframes tickPop{
  0%{transform:scale(var(--tick-from))}
  55%{transform:scale(1.3)}
  78%{transform:scale(.93)}
  100%{transform:scale(1)}
}
.item.done .check{animation:tickPop var(--dur-tick) var(--ease-tick)}

/* floating button: push away, spring back past rest */
.dock{perspective:800px}
.fab{transform:translateZ(0) scale(1);
  transition:transform var(--dur-fab-settle) var(--ease-fab-settle),box-shadow var(--dur-fab-settle) var(--ease-fab-settle)}
.fab.press{transform:translateZ(calc(var(--push-fab) * var(--d))) scale(.9);transition-duration:var(--dur-fab-press)}
@keyframes fabBounce{
  0%  {transform:translateZ(calc(var(--push-fab) * var(--d))) scale(.9)}
  40% {transform:translateZ(calc(34px * var(--d))) scale(1.13)}
  64% {transform:translateZ(calc(-7px * var(--d))) scale(.97)}
  84% {transform:translateZ(calc(9px * var(--d))) scale(1.02)}
  100%{transform:translateZ(0) scale(1)}
}
.fab.bounce{animation:fabBounce var(--dur-fab-bounce) var(--ease-tick) both}

/* the lens dips into the bar and springs back up */
.tabs{perspective:900px}
@keyframes lensBounce{
  0%  {transform:translateX(calc(var(--p) * 100%)) scale3d(1,1,1) translateZ(0)}
  42% {transform:translateX(calc(var(--p) * 100%)) scale3d(1.07,1.24,1) translateZ(calc(28px * var(--d)))}
  70% {transform:translateX(calc(var(--p) * 100%)) scale3d(.97,.92,1) translateZ(calc(-7px * var(--d)))}
  100%{transform:translateX(calc(var(--p) * 100%)) scale3d(1,1,1) translateZ(0)}
}
.lens.bounce{animation:lensBounce var(--dur-lens-bounce) var(--ease-tick) both}

/* sheet and toast arrive from depth */
.sheet{
  transform-origin:50% 100%;
  transform:perspective(1000px) translate(-50%,105%) rotateX(14deg) scale(.96);
  transition:transform var(--dur-sheet) var(--ease-sheet);
}
.sheet.open{transform:perspective(1000px) translate(-50%,0) rotateX(0deg) scale(1)}
.toast{transform:perspective(800px) translate(-50%,-160%) rotateX(-25deg) scale(.92);
  transition:transform var(--dur-toast) var(--ease-toast)}
.toast.show{transform:perspective(800px) translate(-50%,0) rotateX(0deg) scale(1)}

@media (prefers-reduced-motion:reduce){
  .item.press{transform:none;box-shadow:none;filter:none}
  .item.bounce,.item.cascade,.fab.press,.fab.bounce,.lens.bounce,.item.done .check{animation:none!important}
  .fab{transition:none}
  .sheet,.toast{transition:transform var(--dur-reduced) linear}
}

/* ============================================================
   parallax + adjustable depth
   --px / --py are driven by the pointer or the device tilt,
   --d scales depth, --par scales parallax, --tilt gates the 3D.
   ============================================================ */
:root{--d:1;--par:.7;--tilt:1;--px:0;--py:0}

.app{perspective:1200px}
.pages{
  transform-origin:50% 42%;
  transform:rotateX(calc(var(--py) * -1.4deg * var(--tilt) * var(--par)))
            rotateY(calc(var(--px) * 1.8deg * var(--tilt) * var(--par)));
}
.bg{
  translate:calc(var(--px) * -20px * var(--par)) calc(var(--py) * -16px * var(--par));
  scale:1.08;
}
header{translate:calc(var(--px) * 4px * var(--par)) calc(var(--py) * 3px * var(--par))}
.item{
  translate:calc(var(--px) * 6px * var(--par) * var(--ly,1))
            calc(var(--py) * 4px * var(--par) * var(--ly,1));
}
.page .item:nth-child(1){--ly:1}
.page .item:nth-child(2){--ly:1.15}
.page .item:nth-child(3){--ly:1.3}
.page .item:nth-child(4){--ly:1.45}
.page .item:nth-child(5){--ly:1.6}
.page .item:nth-child(n+6){--ly:1.75}

/* gear button */
header{position:relative}
.gear{position:absolute;top:12px;right:18px;width:44px;height:44px;border-radius:50%;
  display:grid;place-items:center;color:var(--ink);padding:0}
.gear svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;
  stroke-linecap:round;stroke-linejoin:round}
.gear:active{transform:scale(.92)}
/* the gear is the one control that sits over the glass rim at the header edge, so its keyboard
   ring is pinned to the button itself instead of being left to the generic :focus-visible rule
   further up: the same 3 px accent ring at the same 2 px offset, so the focus state is unchanged */
.gear:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

/* settings controls */
.set-row{display:flex;align-items:center;justify-content:space-between;gap:12px;
  margin:14px 2px 0;font-weight:800;font-size:16px}
.set-row output{color:var(--ink2);font-weight:800;font-variant-numeric:tabular-nums}
.range{-webkit-appearance:none;appearance:none;width:100%;height:6px;margin:10px 0 4px;
  border-radius:99px;background:rgba(255,255,255,.34);outline:none;border:0}
.range::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;border-radius:50%;
  background:#fff;border:2px solid rgba(255,255,255,.95);cursor:pointer;
  box-shadow:0 2px 9px rgba(30,20,90,.38),inset 0 -1px 2px rgba(0,0,0,.12)}
.range::-moz-range-thumb{width:24px;height:24px;border-radius:50%;background:#fff;border:0;
  box-shadow:0 2px 9px rgba(30,20,90,.38)}
.switch{width:56px;height:32px;border-radius:999px;background:rgba(120,120,140,.38);
  border:1px solid var(--edge);position:relative;padding:0;flex:none;transition:background var(--dur-switch-bg)}
.switch i{position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;
  box-shadow:0 2px 6px rgba(0,0,0,.25);transition:transform var(--dur-switch-knob) var(--ease-switch-knob)}
.switch.on{background:var(--accent)}
.switch.on i{transform:translateX(24px)}
.hint{margin:14px 2px 0;font-size:13.5px;font-weight:600;color:var(--ink2);line-height:1.4}

@media (prefers-reduced-motion:reduce){
  .bg,header,.item{translate:none}
  .pages{transform:none}
}
</style>
</head>

<script>
/* ---- focus trap ----
   a sheet owns the screen while it is open, so Tab must not walk out of it into the page
   behind the scrim: while one is open the tab order is clipped to that sheet's own controls,
   and whatever opened it takes the focus back when it closes. Both sheets live in different
   closures below, so the trap is kept here where either can reach it. */
var SHEET_TRAP=(function(){
  var FOCUSABLE='a[href],button:not([disabled]),input:not([disabled]),select:not([disabled]),textarea:not([disabled]),[tabindex]:not([tabindex="-1"])';
  var held=null,back=null;
  function focusables(el){
    return [].filter.call(el.querySelectorAll(FOCUSABLE),function(n){
      return !!(n.offsetWidth||n.offsetHeight||n.getClientRects().length);
    });
  }
  /* the two sheets are always in the document, parked off the bottom of the screen by a
     transform, so nothing stops a screen reader reaching them while they are closed: each
     one is hidden from the accessibility tree until it is opened, and while it is open it
     says it is a dialog that owns the screen. The buttons that open them carry aria-controls
     and report whether their sheet is up, so the trigger and the sheet agree. */
  function triggers(){ return [].slice.call(document.querySelectorAll("[aria-controls]")); }
  /* keeping a closed sheet out of the accessibility tree is not the same as taking it out of
     the tab order: aria-hidden only speaks to a screen reader, so a keyboard's Tab still
     walked off the end of the page and into the closed sheet — the title field, the notes,
     the due input, the five colour dots and both buttons, none of them on screen — and the
     way back to the page was through all of it. A closed sheet now carries `inert`, the
     attribute for exactly this: its controls leave the tab order, refuse the focus and drop
     out of the accessibility tree, while nothing about how the sheet looks or moves changes.
     It is set as each sheet is parked and lifted again in start(), and a WebView too old to
     know the attribute keeps today's behaviour, since the guard is only that the name is
     there. */
  var CAN_INERT=(function(){
    try{ return "inert" in document.createElement("div"); }catch(e){ return false }
  })();
  function park(el,closed){
    if(!CAN_INERT||!el)return;
    if(closed) el.setAttribute("inert","");
    else el.removeAttribute("inert");
  }
  function start(el){
    if(!el||held===el)return;
    if(held)end(held);
    held=el;back=document.activeElement;
    el.setAttribute("role","dialog");
    el.setAttribute("aria-modal","true");
    el.removeAttribute("aria-hidden");
    park(el,false);
    triggers().forEach(function(b){
      b.setAttribute("aria-expanded", b.getAttribute("aria-controls")===el.id?"true":"false");
    });
  }
  function end(el){
    if(!el||held!==el)return;
    held=null;
    var to=back;back=null;
    try{
      if(to&&to!==document.body&&typeof to.focus==="function"&&document.contains(to))to.focus();
    }catch(e){}
    /* a sheet closed by its own button still holds the focus that button had: drop it before
       hiding the sheet, or the browser refuses the aria-hidden and says so in the console */
    try{ if(el.contains(document.activeElement))document.activeElement.blur(); }catch(e){}
    el.removeAttribute("role");
    el.removeAttribute("aria-modal");
    el.setAttribute("aria-hidden","true");
    park(el,true);
    triggers().forEach(function(b){ b.setAttribute("aria-expanded","false"); });
  }
  document.addEventListener("keydown",function(e){
    if(e.key!=="Tab"||!held)return;
    var f=focusables(held);
    if(!f.length){ e.preventDefault(); return; }
    var first=f[0],last=f[f.length-1],a=document.activeElement,inside=held.contains(a);
    if(e.shiftKey){
      if(!inside||a===first||a===held){ e.preventDefault(); last.focus(); }
    }else if(!inside||a===last||a===held){ e.preventDefault(); first.focus(); }
  });
  /* both sheets arrive closed, so both are parked before the first Tab can reach them */
  ["sheet","settings"].forEach(function(id){ park(document.getElementById(id),true); });
  return { start:start, end:end };
})();

/* ---- native back button ----
   both sheets share one scrim, so "the scrim is open" does not say which sheet is up: the
   shell asked only about the add sheet, clicked Cancel, and Back did nothing at all while
   Settings was open. This closes whichever sheet is actually open, by clicking the same
   button the user would, so the focus trap, the saved settings and the scrim all unwind the
   way they already do. It answers true only when it closed something, so the shell can leave
   the app when nothing was open. Kept here, at the top level, because the two sheets live in
   separate closures below. */
function closeTopSheet(){
  var add=document.getElementById("sheet");
  if(add&&add.classList.contains("open")){
    var cancel=document.getElementById("cancel");
    if(cancel){ cancel.click(); return true; }
  }
  var set=document.getElementById("settings");
  if(set&&set.classList.contains("open")){
    var done=document.getElementById("s-done");
    if(done){ done.click(); return true; }
  }
  return false;
}
window.LiquidBack=closeTopSheet;

(function(){
  var KEY="liquid.reminders.v1", COLORS=palette();
  /* the palette is read from the stylesheet's own custom properties instead of being typed
     again here, so --c1..--c5 above stay the only place a reminder colour is written. The
     values come back exactly as the stylesheet spells them (lower case, no spaces). */
  function palette(){
    var cs=getComputedStyle(document.documentElement), out=[];
    for(var i=1;i<=5;i++) out.push(cs.getPropertyValue("--c"+i).trim().toLowerCase());
    return out;
  }
  var BR=(window.AndroidBridge||null);
  /* a value the app cannot read is put aside under KEY+".corrupt" instead of being
     silently destroyed, so it can still be recovered by hand */
  function stash(raw){
    try{ localStorage.setItem(KEY+".corrupt",raw); }catch(e){}
    try{ console.info("[store] unreadable list kept under "+KEY+".corrupt"); }catch(e){}
  }
  /* the list is capped at the size the interface was built for. A store carrying far more
     reminders than that — a runaway import, a script writing the key by hand — builds that
     many cards on the first render and leaves the page frozen for seconds, so anything past
     the cap is set aside under KEY+".overflow" (like the unreadable value above) and the
     newest MAX_ITEMS are the ones kept. */
  var MAX_ITEMS=500;
  /* a reminder's two lines of text have a length too, and it is written once, in the markup:
     the title field carries maxlength="120" and the notes field maxlength="200", so the field
     that writes a value is also the place that says how long it may be — the same rule the
     palette follows off the stylesheet and the sliders off their own min/max. Read here, once,
     because load() runs before $ is assigned. Nothing typed in the app can be longer than this,
     so the limit is invisible to it; what it holds back is the other way a value arrives — a
     store written by an older build, or one edited by hand — where a title of fifty thousand
     characters becomes a card with no end, a label both of its buttons carry that a screen
     reader has to read out in full, a toast with nowhere to put it and a JSON string of that
     size handed to the shell on every change. A field that is not there caps nothing. */
  var TITLE_MAX=fieldMax("f-title"), NOTES_MAX=fieldMax("f-notes");
  function fieldMax(id){
    var el=document.getElementById(id), n=el?parseInt(el.getAttribute("maxlength"),10):NaN;
    return (isFinite(n)&&n>0)?n:Infinity;
  }
  function capList(list){
    if(list.length<=MAX_ITEMS) return list;
    var keep=list.slice(list.length-MAX_ITEMS), drop=list.slice(0,list.length-MAX_ITEMS);
    try{ localStorage.setItem(KEY+".overflow",JSON.stringify(drop)); }catch(e){}
    try{ console.info("[store] kept the newest "+MAX_ITEMS+" of "+list.length+" reminders"); }catch(e){}
    return keep;
  }
  /* the two keys written above hold copies of a value the app has already dealt with: the
     unreadable store kept aside for hand recovery, and the reminders trimmed off a list past
     the cap. Neither is ever read by the app — only by a person — and either can be as large as
     the store itself. They are therefore the one thing it can give up without losing anything
     it is still showing, so a write refused for want of room drops them and is tried once more.
     A full store then costs the user those backups instead of the reminder they just changed;
     the copy is still put aside in the first place, it is only given up when the room it takes
     is the room the live list needs. Returns whether anything was actually freed. */
  function clearSpare(){
    var freed=false, keys=[KEY+".corrupt",KEY+".overflow"];
    for(var k=0;k<keys.length;k++){
      try{
        if(localStorage.getItem(keys[k])!==null){ localStorage.removeItem(keys[k]); freed=true; }
      }catch(e){}
    }
    return freed;
  }
  /* the furthest instant a Date can hold. The language gives a Date 100,000,000 days either
     side of the epoch, so 8.64e15 ms is the last millisecond that is a moment at all and
     anything past it is not a time that exists. Read off the Date object itself, once, so the

    if(BR&&BR.buzz){ try{ BR.buzz(); return; }catch(e){} }
    try{
      if(navigator.userActivation&&navigator.userActivation.hasBeenActive===false) return;
      if(navigator.vibrate) navigator.vibrate([120,60,120]);
    }catch(e){}
  }
  /* the buzz and the tray copy belong to the moment the reminder came due, so they happen here;
     only the words on the toast wait their turn */
  function alertFor(it){
    buzz();
    showNotify(it.title);
    toastQ.push(it);pumpToast();
  }
  /* a tap dismisses what is up and lets the next waiting alert through at once */
  toast.onclick=function(){toast.classList.remove("show");clearTimeout(tt);toastUntil=0;pumpToast()};
  /* the wall clock can be put back under the app — a manual correction, a time-zone change, an
     NTP step — and a reminder that has already fired keeps fired:true, so its moment comes round
     again with the alert already spent and it stays silent for good. A backward step is told
     apart from time simply passing by comparing the two clocks: performance.now() keeps
     counting straight through a change of the system clock, so a wall delta well short of the
     monotonic one is the clock going back, not the app waiting. */
  function monoNow(){
    try{ if(window.performance&&performance.now) return performance.now(); }catch(e){}
    return 0;
  }
  var clockAt=Date.now(), monoAt=monoNow();
  function clockWentBack(){
    var n=Date.now(), m=monoNow(), back=false;
    if(monoAt&&m>=monoAt&&(n-clockAt)<(m-monoAt)-1000) back=true;
    clockAt=n; monoAt=m;
    return back;
  }
  /* one bad reminder must not take the timer down with it. An alert that throws used to end the
     tick on the spot, so schedule() never ran, the single timer that wakes at the next due moment
     was never re-armed, and every reminder after the bad one stayed silent until a reload. Each
     reminder is now handled on its own, and the re-arm happens whatever the work above it did, so
     a broken row costs its own alert and nothing more. */
  function recover(e,where){
    try{ console.info("[tick] recovered in "+where+": "+((e&&e.message)||e)); }catch(e2){}
  }
  function tick(){
    var now=Date.now(),fired=[];
    try{
      /* after a step back, a reminder whose due is in the future again has a moment still to
         come, so its alert is handed back and the timer is re-armed for it; one that is still
         overdue keeps its spent alert, so nothing rings twice.
         The shell is told as well, and it has to be: `fired` is part of the signature it keeps
         of the list it has armed, and an alert handed back here is a reminder it has not armed
         — the alarm that fired for it was consumed by the receiver, so the tray copy of a
         reminder the page has just handed back would never be built. The repairs load() makes
         are handed over by the syncAll() at the end of the first draw; this one happens long
         after that, so it is handed over here, and the reminder rings with the app closed too. */
      if(clockWentBack()){
        var again=false;
        items.forEach(function(it){if(!it.done&&it.fired&&it.due&&it.due>now){it.fired=false;again=true}});
        if(again){persist();syncAll();}
      }
    }catch(e){ recover(e,"clock") }
    try{
      items.forEach(function(it){
        try{ if(!it.done&&!it.fired&&it.due&&it.due<=now){it.fired=true;fired.push(it);alertFor(it)} }
        catch(e){ recover(e,"alert") }
      });
    }catch(e){ recover(e,"scan") }
    /* a reminder coming due changes exactly one card — its due line turns red — so that one card
       is moved into place, the way a toggle and a delete already do, instead of render(), which
       empties all four pages and builds a fresh card for every reminder on each of them. That
       rebuild ran at the moment the alert toast was arriving with its own animation, so a long
       list paid for a thousand nodes just to redden one timestamp. Each fired reminder is moved
       on its own, so one bad row costs its own card and nothing more. */
    if(fired.length){
      try{persist()}catch(e){recover(e,"save")}
      try{ moveCards(fired) }catch(e){ recover(e,"draw") }
    }
    /* the timer is re-armed even when the work above threw, so the chain of due moments survives */
    try{ schedule(); }catch(e){ recover(e,"schedule") }
  }
  /* one timer that wakes exactly at the next due reminder, instead of polling every 15 s */
  var tickT;
  function nextDue(){
    var best=0;
    items.forEach(function(it){if(!it.done&&!it.fired&&it.due&&(!best||it.due<best))best=it.due});
    return best;
  }
  function schedule(){
    clearTimeout(tickT);tickT=0;
    try{ rearmDay(); }catch(e){ recover(e,"day") }
    var t=0;
    /* a row that cannot be read while looking for the next due moment must not leave the app with
       no timer at all: the wake falls back to a minute's time, as the old poll did, and the chain
       carries on */
    try{ t=nextDue(); }catch(e){ recover(e,"next"); t=Date.now()+60000 }
    if(!t)return;
    tickT=setTimeout(function(){tickT=0;tick()},Math.min(Math.max(0,t-Date.now())+60,2147483647));
  }
  /* the day rolls over at local midnight, and the Today/Upcoming split, the "Today," and
     "Tomorrow," labels and the date under the title are all decided when a page is drawn — so
     the app draws itself once more at the next local midnight instead of sitting on yesterday's
     partition until the next tap. The timer is re-armed from schedule(), which every save and
     every alert already calls, and it re-arms itself, so a device that slept through midnight
     catches up on the first wake after it. */
  var dayT=0, dayKey=dayStamp();
  function dayStamp(){var n=new Date();return n.getFullYear()+"-"+(n.getMonth()+1)+"-"+n.getDate()}
  function rearmDay(){
    if(dayT){clearTimeout(dayT);dayT=0}
    var n=new Date(), m=new Date(n.getFullYear(),n.getMonth(),n.getDate()+1,0,0,0,0);
    var wait=m.getTime()-n.getTime();
    if(!isFinite(wait)||wait<=0) wait=60000; /* no reachable midnight: look again in a minute */
    dayT=setTimeout(function(){
      dayT=0;
      var k=dayStamp();
      if(k!==dayKey){ dayKey=k; render(); }
      schedule();
    },Math.min(wait+50,2147483647));
  }
  /* coming back from the background is not a redraw. The page was not on screen, so nothing the
     user can see changed while it was away: a reminder that came due is already put in its place
     by tick(), which moves that one card and reddens its due line, and the Today/Upcoming split,
     the "Today," and "Tomorrow," labels and the date under the title can only change at a local
     midnight, which rearmDay() already watches. Every resume used to empty all four pages and
     build a fresh card for every reminder — on a long list that is every card on every page
     thrown away and made again each time the app is switched back to, at the exact moment the
     user is waiting for it. The redraw now happens only when the day has rolled over while the
     app was hidden, which is the one thing a resume cannot get from tick(). */
  document.addEventListener("visibilitychange",function(){
    document.documentElement.classList.toggle("paused",document.hidden);
    if(document.hidden)return;
    tick();
    var k=dayStamp();
    if(k!==dayKey){ dayKey=k; render(); }
  });

  /* ---- first-paint marker: one console line per load, so a run can compare before and
     after. It only reads timings and writes to the console; nothing on screen is touched. ---- */
  var tRender=0, tFrame=0, marked=false;
  function paintEntry(){
    var t=0;
    if(window.performance&&performance.getEntriesByType){
      try{ performance.getEntriesByType("paint").forEach(function(e){
        if(e.name==="first-contentful-paint") t=e.startTime;
      }); }catch(e){}
    }
    return t;
  }
  function markFirstPaint(){
    if(marked)return; marked=true;
    var fcp=paintEntry();
    var m={boot:Math.round(__tBoot),render:Math.round(tRender),frame:Math.round(tFrame||tRender),fcp:Math.round(fcp)};
    window.__firstPaint=m;
    try{ console.info("[perf] first paint: boot "+m.boot+"ms, first render "+m.render+"ms, first frame "+m.frame+"ms, fcp "+(fcp?m.fcp+"ms":"n/a")); }catch(e){}
  }
  /* the paint entry lands a beat after the first frame: take it the moment it arrives, and
     stop waiting after 3 s so a browser that never reports one still writes the line */
  if(window.PerformanceObserver){
    try{
      var paintObs=new PerformanceObserver(function(){markFirstPaint();paintObs.disconnect()});
      paintObs.observe({type:"paint",buffered:true});
    }catch(e){}
  }
  var paintWait=0;
  (function awaitPaint(){
    if(marked)return;
    if(paintEntry())return markFirstPaint();
    if(paintWait>=3000)return markFirstPaint();
    paintWait+=100;setTimeout(awaitPaint,100);
  })();

  /* specular light follows the finger / cursor */
  if(window.chrome)document.documentElement.classList.add("refract");
  /* specular highlight: coalesce pointer events to one layout read per frame */
  var specPending=false,specEvt=null;
  /* will-change pins a compositor layer, so it is carried only while the highlight is moving:
     litOn() adds it with the first move, litOff() drops it after the .35 s fade-out */
  var litEl=null;
  function litOn(g){
    if(litEl&&litEl!==g)litOff(litEl);
    if(g._litT){clearTimeout(g._litT);g._litT=0}
    g.classList.add("lit");litEl=g;
  }
  function litOff(g){
    if(!g)return;
    if(g._litT)clearTimeout(g._litT);
    g._litT=setTimeout(function(){g._litT=0;g.classList.remove("lit");if(litEl===g)litEl=null},420);
  }
  document.addEventListener("pointermove",function(e){
    specEvt=e;
    if(specPending)return;
    specPending=true;
    requestAnimationFrame(function(){
      specPending=false;
      var ev=specEvt;if(!ev)return;
      var g=ev.target.closest&&ev.target.closest(".glass");if(!g)return;
      var r=g.getBoundingClientRect();
      g.style.setProperty("--mx",(ev.clientX-r.left)+"px");g.style.setProperty("--my",(ev.clientY-r.top)+"px");g.style.setProperty("--lit",1);
      litOn(g);
    });
  });
  /* a pointer moving across a panel crosses an element boundary every few pixels — from one tab
     to the next, from a card's text to its check button, from a button to the icon inside it —
     and `pointerout` fires on every one of those crossings, because the event is about the
     element being left and says nothing about the panel. Each one took the specular highlight
     off and armed the 420 ms fade behind it, and the next frame's `pointermove` put the
     highlight straight back and cancelled that fade, so a finger dragged across the tab bar
     turned the highlight off and on several times a second: an un-write and a write of `--lit`
     on a `backdrop-filter` element — the most expensive thing on the screen to repaint — and a
     visible dip in the highlight while the finger had not left the panel at all. The pointer
     has left the panel only when it has entered something the panel does not contain, so that
     is the question asked here: crossing to another element inside the same glass, or to a
     child of the element just left, is not a departure and now does nothing. Leaving for
     anything else — another glass, the page behind, or out of the window — takes the highlight
     down exactly as before, and the `.lit` class and its fade still follow the same two calls. */
  document.addEventListener("pointerout",function(e){
    var g=e.target.closest&&e.target.closest(".glass");if(!g)return;
    var to=e.relatedTarget;
    if(to&&g.contains&&g.contains(to))return;
    g.style.removeProperty("--lit");litOff(g);
  });

  render();restoreTab();sync();tick();syncAll();if(BR)BR.askNotifications();
  tRender=performance.now();
  requestAnimationFrame(function(){requestAnimationFrame(function(){tFrame=performance.now()})});
})();
</script>

<script>
/* ---- depth bounce driver ---- */
(function(){
  /* the OS "remove animations" setting is a switch in system Settings, one screen away, and the
     app is still running behind it while it is flipped: the answer used to be read once at load
     and held until the next launch, so the press tilt, the cascade and the tab bounce kept
     playing for as long as the app stayed open. It is kept in one place now and re-read when it
     changes, so the very next press already honours it. */
  var motionQ = window.matchMedia ? matchMedia('(prefers-reduced-motion: reduce)') : null;
  var reduce = !!(motionQ && motionQ.matches);
  if(motionQ){
    var onMotion = function(){ reduce = !!motionQ.matches; };
    if(motionQ.addEventListener) motionQ.addEventListener('change', onMotion);
    else if(motionQ.addListener) motionQ.addListener(onMotion);   /* older WebViews */
  }
  var pressed = null;

  /* press: lift the card toward the viewer and tilt it toward the finger */
  document.addEventListener('pointerdown', function(e){
    var it = e.target.closest && e.target.closest('.item');
    if(!it || reduce) return;
    /* the browser already measured offsetX/offsetY against the event target, so the
       press point costs no layout read; walk the offsets up into the card's own box */
    var ox = e.offsetX, oy = e.offsetY, n = e.target;
    while(n && n !== it){ ox += n.offsetLeft; oy += n.offsetTop; n = n.offsetParent; }
    var w = it.offsetWidth, h = it.offsetHeight;
    var px = w ? ox / w : .5;
    var py = h ? oy / h : .5;
    it.style.setProperty('--ry', ((px - .5) * -8).toFixed(2) + 'deg');
    it.style.setProperty('--rx', ((py - .5) * 7).toFixed(2) + 'deg');
    it.classList.remove('bounce');
    it.classList.add('press');
    pressed = it;
  }, {passive:true});

  function release(){
    if(!pressed) return;
    var it = pressed; pressed = null;
    it.classList.remove('press');
    if(!reduce) it.classList.add('bounce');
  }
  document.addEventListener('pointerup', release, {passive:true});
  document.addEventListener('pointercancel', release, {passive:true});

  /* cards cascade in from depth whenever the list is rebuilt */
  var pagesEl = document.getElementById('pages');
  if(pagesEl && window.MutationObserver){
    new MutationObserver(function(muts){
      if(reduce) return;
      muts.forEach(function(m){
        var i = 0;
        Array.prototype.forEach.call(m.addedNodes, function(n){
          if(!n.classList || !n.classList.contains('item')) return;
          n.style.animationDelay = Math.min(i++, 7) * 38 + 'ms';
          n.classList.add('cascade');
          n.addEventListener('animationend', function h(){
            n.classList.remove('cascade');
            n.style.animationDelay = '';
            n.removeEventListener('animationend', h);
          });
        });
      });
    }).observe(pagesEl, {childList:true, subtree:true});
  }

  /* the add button pushes away, then springs past rest */
  var fab = document.getElementById('fab');
  if(fab){
    fab.addEventListener('pointerdown', function(){
      if(reduce) return;
      fab.classList.remove('bounce');
      fab.classList.add('press');
    }, {passive:true});
    ['pointerup','pointercancel','pointerleave'].forEach(function(t){
      fab.addEventListener(t, function(){
        if(reduce || !fab.classList.contains('press')) return;
        fab.classList.remove('press');
        fab.classList.add('bounce');
      }, {passive:true});
    });
    fab.addEventListener('animationend', function(){ fab.classList.remove('bounce'); });
  }

  /* the lens dips and springs back each time a tab settles. This handler reads clientWidth,
     which forces a layout, and it used to do that once per scroll event: a fling fires far
     more events than there are frames, so a single swipe measured the page dozens of times
     for an answer that can only change once a frame. It rides one requestAnimationFrame now,
     like the pager's own handler — the first event of a frame claims the slot and the rest
     ride on it, so the read, the index and the bounce are decided once per frame. Nothing
     about when the bounce plays changes: it still starts on the frame where the settled
     index changes, and the lastIdx guard below still swallows every other frame. */
  var lensEl = document.querySelector('.lens');
  if(pagesEl && lensEl){
    var lastIdx = -1, lensPending = false;
    /* the width is the same on every frame of a swipe and only ever changes when the pager is
       resized, so it is read when it changes instead of once per frame. Reading clientWidth
       here flushed the style the pager's own per-frame handler had just written on the tabs —
       the two handlers ride the same frame and that one runs first — so every frame of every
       swipe forced a style recalc and a layout of the whole board to answer a number that had
       not moved since the last frame: measured at 0.5-1.3 ms a frame on a full list of five
       hundred, on the one gesture the app is built around. The ResizeObserver is the same one
       measure() already uses for the pager, so the number is refreshed exactly when the pager
       is re-laid-out — a rotation, the window resizing — and the settled index it produces is
       the one clientWidth would have produced. */
    var lensW = 0;
    function lensWidth(){
      if(!lensW) lensW = pagesEl.clientWidth || 1;
      return lensW;
    }
    if(window.ResizeObserver) new ResizeObserver(function(){ lensW = 0; }).observe(pagesEl);
    window.addEventListener('resize', function(){ lensW = 0; }, {passive:true});
    pagesEl.addEventListener('scroll', function(){
      if(lensPending) return;
      lensPending = true;
      requestAnimationFrame(function(){
        lensPending = false;
        var w = lensWidth();
        var idx = Math.round(pagesEl.scrollLeft / w);
        if(idx === lastIdx) return;
        lastIdx = idx;
        if(reduce) return;
        lensEl.classList.remove('bounce');
        void lensEl.offsetWidth;              /* restart the animation */
        lensEl.classList.add('bounce');
      });
    }, {passive:true});
    lensEl.addEventListener('animationend', function(){ lensEl.classList.remove('bounce'); });
  }
})();
</script>

<script>
/* ---- parallax engine + settings ---- */
(function(){
  var root = document.documentElement;
  var KEY = 'liquid.settings.v1';
  /* one source of truth for the settings defaults: the first-run state and the
     Reset button both copy this, so the two can never drift apart */
  var DEFAULTS = { depth: 100, par: 70, tilt: true };
  function defaultState(){
    return { depth: DEFAULTS.depth, par: DEFAULTS.par, tilt: DEFAULTS.tilt };
  }
  var st = defaultState();

  /* a stored setting is only kept if the slider it belongs to can hold it. The range of each
     slider is written once, as min/max/step in the markup, so the bounds are read off the input
     itself rather than typed again here — the same rule the palette follows. A value that is not
     a finite number, or one a hand-edited store puts outside the range, becomes the default; one
     inside the range but between two steps is snapped to the step the slider shows, so what is
     applied, what the slider holds and the percentage printed beside it always agree. Without
     this a stored depth of 5000 applied `--d:50` and lifted every card fifty times as far as the
     interface was built for, while the slider beside it read 150 and the readout said 5000%. */
  function keep(v,id,fallback){
    var n=(typeof v==="number"&&isFinite(v))?v:fallback;
    var el=document.getElementById(id);
    if(!el) return n;
    var lo=parseFloat(el.min), hi=parseFloat(el.max), step=parseFloat(el.step);
    if(!isFinite(lo)||!isFinite(hi)||hi<lo) return n;
    if(n<lo) n=lo; else if(n>hi) n=hi;
    if(isFinite(step)&&step>0) n=lo+Math.round((n-lo)/step)*step;
    return Math.min(hi,Math.max(lo,n));
  }
  var repaired=false;
  try{
    var saved = JSON.parse(localStorage.getItem(KEY) || 'null');
    if(saved && typeof saved === 'object'){
      var d=keep(saved.depth,'s-depth',DEFAULTS.depth), p=keep(saved.par,'s-par',DEFAULTS.par);
      if(saved.depth!==undefined && d!==saved.depth) repaired=true;
      if(saved.par!==undefined   && p!==saved.par)   repaired=true;
      st.depth=d; st.par=p;
      if(typeof saved.tilt === 'boolean') st.tilt = saved.tilt;
    }
  }catch(e){}

  /* dragging a slider fires an input event per frame, and every one of them wrote the whole
     settings object to the store on the spot: one pass across the Depth slider cost sixty
     synchronous writes, on the same thread that is trying to keep the drag smooth. Writes are
     coalesced now — the first lands at once and the rest ride a single timer that writes
     whatever the sliders hold when it runs, so a drag costs a couple of writes instead of one
     per frame and the store still ends on the value the finger stopped at. The change event
     that ends a drag, the Tilt and Reset buttons and a page being hidden all flush at once. */
  var SAVE_EVERY=120, saveT=0, unsaved=false;
  function writeSettings(){ try{ localStorage.setItem(KEY, JSON.stringify(st)); }catch(e){} }
  function flushSettings(){
    if(saveT){clearTimeout(saveT);saveT=0}
    if(!unsaved)return;
    unsaved=false;
    writeSettings();
  }
  function save(){
    unsaved=true;
    if(saveT)return;   /* a write is already queued and will pick up the latest values */
    flushSettings();
    saveT=setTimeout(flushSettings,SAVE_EVERY);
  }
  /* a drag cut short by the app going away still writes what the sliders hold */
  window.addEventListener("pagehide",flushSettings);
  document.addEventListener("visibilitychange",function(){ if(document.hidden) flushSettings(); });
  /* the repaired settings are written back, like the list repairs on the other side of the page,
     so the store says what the sliders show and a later run reads a value it can keep */
  if(repaired) save();

  /* the same setting, read here for the parallax and the 3D tilt. It is watched rather than
     sampled once, so flipping "remove animations" in system Settings while the app is open
     parks the parallax and the tilt at once instead of at the next launch: the listener
     re-applies the two variables apply() already writes, and nothing about the look changes
     until the setting itself does. */
  var motionQ = window.matchMedia ? matchMedia('(prefers-reduced-motion: reduce)') : null;
  var reduce = !!(motionQ && motionQ.matches);
  /* whether the lean can be seen at all. --px and --py only ever reach the cards multiplied by
     --par, and --par is 0 in two places: under reduced motion, and at the bottom of the Parallax
     slider. At those two settings the loop still ran a frame on every pointer move and wrote
     --px and --py on the root each time, and a custom property on the root is inherited by every
     element that reads it, so each write invalidated the style of the whole page to move the
     cards by nothing: work spent on the one setting where the user asked for less motion, and
     on the slider's own floor. The flag is read by kick() and loop(), which take the target as
     the current one instead of drawing it. Nothing about where the cards lean changes, because
     at --par:0 the lean is multiplied away either way, and the position kept here is the one the
     loop would have reached, so turning the slider back up shows the cards where they were. */
  var parOn = true;

  function apply(){
    root.style.setProperty('--d', (st.depth / 100).toFixed(2));
    root.style.setProperty('--par', reduce ? '0' : (st.par / 100).toFixed(2));
    root.style.setProperty('--tilt', st.tilt && !reduce ? '1' : '0');
    parOn = !reduce && st.par > 0;
  }
  apply();
  if(motionQ){
    var onMotion = function(){ reduce = !!motionQ.matches; apply(); };
    if(motionQ.addEventListener) motionQ.addEventListener('change', onMotion);
    else if(motionQ.addListener) motionQ.addListener(onMotion);   /* older WebViews */
  }

  /* ---- motion source: device tilt if we have it, otherwise the pointer ---- */
  var tx = 0, ty = 0, cx = 0, cy = 0, running = true, seenOrient = false;

  window.addEventListener('deviceorientation', function(e){
    if(e.beta == null && e.gamma == null) return;
    seenOrient = true;
    var g = Math.max(-45, Math.min(45, e.gamma || 0));
    var b = Math.max(-45, Math.min(45, (e.beta || 0) - 35));
    tx = g / 45;
    ty = b / 45;
    kick();
  }, {passive:true});

  /* the pointer is the motion source whenever the device reports no orientation, and it used
     to be turned into a target on every event: each pointermove divided the position by
     window.innerWidth and window.innerHeight, which is a layout read, taken straight after
     the loop above had written --px and --py, so a swipe forced a layout on every one of the
     many events a frame carries. The position is parked here and turned into a target once a
     frame — the first event of a frame claims the slot and the rest ride on it, the way the
     pager and the lens handlers already work — and the viewport is measured when it changes
     rather than on every event. Nothing about where the cards lean changes: the same position
     gives the same --px and --py, one frame later at most. */
  var ptrX = 0, ptrY = 0, vw = 1, vh = 1, ptrPending = false;
  function viewport(){ vw = window.innerWidth || 1; vh = window.innerHeight || 1; }
  viewport();
  window.addEventListener('resize', viewport, {passive:true});
  document.addEventListener('pointermove', function(e){
    if(seenOrient) return;
    ptrX = e.clientX; ptrY = e.clientY;
    if(ptrPending) return;
    ptrPending = true;
    requestAnimationFrame(function(){
      ptrPending = false;
      tx = (ptrX / vw - .5) * 2;
      ty = (ptrY / vh - .5) * 2;
      kick();
    });
  }, {passive:true});

  /* a sheet owns the screen while it is open, so the parallax is pointless there:
     park the loop instead of animating behind the scrim */
  var addSheetEl = document.getElementById('sheet');
  var setSheetEl = document.getElementById('settings');
  function sheetOpen(){
    return !!((addSheetEl && addSheetEl.classList.contains('open')) ||
              (setSheetEl && setSheetEl.classList.contains('open')));
  }

  function kick(){
    /* with the lean multiplied away there is no frame worth running: the target is taken as the
       current one, so the loop is not woken for a change nobody can see, and the position it
       would have reached is already here for the next kick to start from */
    if(!parOn){ cx = tx; cy = ty; return; }
    if(sheetOpen()) return;
    if(!running){ running = true; requestAnimationFrame(loop); }
  }

  function loop(){
    if(!parOn){ cx = tx; cy = ty; running = false; return; }   /* lean at 0: no frames */
    if(sheetOpen()){ running = false; return; }   /* sheet open: no frames */
    cx += (tx - cx) * .12;
    cy += (ty - cy) * .12;
    var settled = Math.abs(tx - cx) < .0008 && Math.abs(ty - cy) < .0008;
    if(settled){ cx = tx; cy = ty; }
    root.style.setProperty('--px', cx.toFixed(4));
    root.style.setProperty('--py', cy.toFixed(4));
    if(settled){ running = false; return; }   /* idle: stop burning frames */
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);

  /* ---- settings sheet ---- */
  var sheet = document.getElementById('settings');
  var scrim = document.getElementById('scrim');
  var gear  = document.getElementById('gear');
  var depth = document.getElementById('s-depth');
  var par   = document.getElementById('s-par');
  var oDepth = document.getElementById('o-depth');
  var oPar   = document.getElementById('o-par');
  var tiltBtn = document.getElementById('s-tilt');
  if(!sheet || !gear) return;

  function paint(){
    depth.value = st.depth;
    par.value = st.par;
    oDepth.textContent = st.depth + '%';
    oPar.textContent = st.par + '%';
    depth.setAttribute('aria-valuetext', st.depth + '%');
    par.setAttribute('aria-valuetext', st.par + '%');
    tiltBtn.classList.toggle('on', !!st.tilt);
    tiltBtn.setAttribute('aria-checked', st.tilt ? 'true' : 'false');
  }
  paint();

  function open(){
    var add = document.getElementById('sheet');
    if(add){ add.classList.remove('open'); SHEET_TRAP.end(add); }
    sheet.classList.add('open');
    scrim.classList.add('open');
    SHEET_TRAP.start(sheet);
  }
  /* as with the add sheet, this one only closes while it is the sheet that is up: its Escape
     handler is on the document and its scrim is the shared one, so an Escape pressed with
     nothing open used to run this and pull the scrim out from under whichever sheet was
     actually up */
  function close(){
    if(!sheet.classList.contains('open')) return;
    sheet.classList.remove('open');
    scrim.classList.remove('open');
    SHEET_TRAP.end(sheet);
  }

  gear.addEventListener('click', open);
  document.getElementById('s-done').addEventListener('click', close);
  scrim.addEventListener('click', close);
  document.addEventListener('keydown', function(e){ if(e.key === 'Escape') close(); });

  depth.addEventListener('input', function(){
    st.depth = +depth.value; oDepth.textContent = st.depth + '%';
    depth.setAttribute('aria-valuetext', st.depth + '%'); apply(); save();
  });
  par.addEventListener('input', function(){
    st.par = +par.value; oPar.textContent = st.par + '%';
    par.setAttribute('aria-valuetext', st.par + '%'); apply(); save();
    /* the loop is parked while the lean is multiplied away, so raising the slider off 0 draws
       the cards once at the position the pointer left them at, instead of waiting for the next
       move to wake the loop */
    kick();
  });
  /* the change event marks the end of a drag: the trailing write goes now, not a beat later */
  depth.addEventListener('change', flushSettings);
  par.addEventListener('change', flushSettings);
  tiltBtn.addEventListener('click', function(){
    st.tilt = !st.tilt; paint(); apply(); save();
    tx = ty = 0; kick();
  });
  document.getElementById('s-reset').addEventListener('click', function(){
    st = defaultState();
    paint(); apply(); save(); tx = ty = 0; kick();
  });
})();
</script>
</body>
</html>
